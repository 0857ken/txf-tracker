name: Strategy 4 Account Preincrement Audit
on:
  push:
    branches:
      - acceptance/strategy4-account-preincrement-audit-2026-10-07
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix prod/tools/defense-runner --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Read formal Strategy 4 account
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node tools/audit-strategy4-account.cjs
