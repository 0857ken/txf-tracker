name: Strategy 4 Sync Margin For 3 Lots

on:
  push:
    branches:
      - ops/strategy4-sync-margin-3lots-2026-10-07
    paths:
      - '.github/workflows/strategy4-sync-margin-3lots.yml'
      - 'tools/sync-strategy4-margin-3lots.cjs'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix prod/tools/defense-runner --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Guarded margin-only sync
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node tools/sync-strategy4-margin-3lots.cjs
