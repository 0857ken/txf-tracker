name: Backtest v1.18 SRF residual-fill proxy
on:
  workflow_dispatch:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v118_srf_residual_proxy.py'
      - '.github/workflows/backtest-v118.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests beautifulsoup4 yfinance
      - run: python research/backtest_v118_srf_residual_proxy.py
