name: Strategy 4 Account Save Hotfix Acceptance

on:
  push:
    branches:
      - acceptance/strategy4-account-save-2026-10-05

permissions:
  contents: read

jobs:
  isolated-clone-test:
    runs-on: ubuntu-latest
    steps:
      - name: Independent checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check defense.js
          node --check defense-market.js
          node --check defense-core.js
          node --check defense-governance.js
          node --check defense-ledger.js

      - name: Account save regression
        run: node --test tests/defense-account-save.test.cjs

      - name: Strategy 4 Fubon regression
        run: node --test tests/defense-fubon-market.test.cjs

      - name: Existing Node regression
        run: node --test tests/follow-core.test.cjs tests/follow-data.test.cjs tests/offline-manual-preview.test.cjs tests/pluggable-market-adapter.test.cjs

      - name: Diff whitespace check
        run: git diff --check HEAD~2 HEAD

      - name: Verify isolated acceptance branch
        run: test "$(git branch --show-current)" = "acceptance/strategy4-account-save-2026-10-05"
