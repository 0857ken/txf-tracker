name: Firestore Rules Read-only Audit

on:
  push:
    branches:
      - acceptance/firestore-rules-audit-2026-10-05

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/strategy4-production-forward-2026-10-05
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Google/Firebase libraries
        run: npm ci --prefix prod/tools/defense-runner --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Read current Firestore rules only
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node tools/read-firestore-rules.cjs
