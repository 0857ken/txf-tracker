name: Backtest v1

on:
  push:
    branches:
      - backtest-v1
    paths:
      - 'research/backtest_v1.py'
      - '.github/workflows/backtest-v1.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: backtest-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance

      - name: Run backtest
        run: python research/backtest_v1.py
