name: Probe TAIFEX v1.17

on:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/probe_taifex_forms.py'
      - '.github/workflows/probe-taifex-v117.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests beautifulsoup4
      - run: python research/probe_taifex_forms.py
