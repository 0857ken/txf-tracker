name: Backtest v1.17 actual futures margin-first
on:
  workflow_dispatch:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v117_actual_futures_margin.py'
      - 'research/run_v117_fixed.py'
      - '.github/workflows/backtest-v117.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests beautifulsoup4 yfinance
      - run: python research/run_v117_fixed.py
