name: 更新報價資料

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取報價並計算均線
        run: python scripts/fetch_market.py

      - name: Commit 更新的 JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          if git diff --staged --quiet; then
            echo "資料無變化,跳過 commit"
          else
            git commit -m "chore: 自動更新報價資料 [skip ci]"
            git pull --rebase origin gh-pages && git push origin gh-pages
          fi
