name: Futures Trade Ledger Read-only Audit

on:
  push:
    branches:
      - acceptance/futures-trade-ledger-audit-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed trade ledger branch
        uses: actions/checkout@v4
        with:
          ref: feature/futures-trade-ledger-2026-10-11

      - name: Syntax check trade ledger modules
        run: |
          node --check futures-trade-core.mjs
          node --check futures-trades.js

      - name: Unit test matching rules
        run: |
          node --input-type=module <<'JS'
          import {applyTrade, summarizeOpenLots} from './futures-trade-core.mjs';

          const seed = {
            schemaVersion: 1,
            cutoverDate: '2026-10-11',
            revision: 0,
            openLots: [
              {id:'core',product:'TMF',month:'2026-10',lots:2,entryPrice:50068,openedAt:'2026-10-05T12:00:00+08:00',tag:'core'}
            ]
          };

          const buy = applyTrade(seed, {
            id:'buy1',date:'2026-10-11',at:'2026-10-11T12:00:00+08:00',
            product:'TMF',month:'2026-10',side:'buy',lots:1,price:51000,matchPolicy:'lifo'
          }).nextState;

          const lifo = applyTrade(buy, {
            id:'sell1',date:'2026-10-11',at:'2026-10-11T13:00:00+08:00',
            product:'TMF',month:'2026-10',side:'sell',lots:1,price:51100,matchPolicy:'lifo'
          });
          if (lifo.realized.grossPnlTwd !== 1000) throw new Error('LIFO realized mismatch');
          const lifoSummary = summarizeOpenLots(lifo.nextState.openLots);
          if (lifoSummary.length !== 1 || lifoSummary[0].lots !== 2 || lifoSummary[0].averageEntry !== 50068)
            throw new Error('LIFO should preserve core lots');

          const fifo = applyTrade(buy, {
            id:'sell2',date:'2026-10-11',at:'2026-10-11T13:00:00+08:00',
            product:'TMF',month:'2026-10',side:'sell',lots:1,price:51100,matchPolicy:'fifo'
          });
          if (fifo.realized.grossPnlTwd !== 10320) throw new Error('FIFO realized mismatch');

          let oversell = false;
          try {
            applyTrade(seed, {
              id:'bad',date:'2026-10-11',at:'2026-10-11T13:00:00+08:00',
              product:'TMF',month:'2026-10',side:'sell',lots:3,price:51100,matchPolicy:'lifo'
            });
          } catch { oversell = true; }
          if (!oversell) throw new Error('oversell guard missing');

          console.log('TRADE_CORE_TEST_OK');
          JS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firestore SDK
        run: pip install firebase-admin

      - name: Inspect current futures position and realized ledger
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ["FIREBASE_KEY"]))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          owner = db.collection("strategy4System").document("owner").get()
          owner_uid = (owner.to_dict() or {}).get("uid") if owner.exists else None
          if not owner_uid:
              raise SystemExit("AUDIT_FAIL owner_missing")

          base = (
              db.collection("defenseUsers").document(owner_uid)
              .collection("strategies").document("0050-defense-v1")
          )
          account_doc = base.collection("state").document("account").get()
          if not account_doc.exists:
              raise SystemExit("AUDIT_FAIL account_missing")
          account = account_doc.to_dict() or {}

          legacy_docs = list(
              db.collection("users").document("me").collection("positions").stream()
          )
          realized_docs = list(
              db.collection("users").document("me").collection("realizedPnl").stream()
          )
          trade_docs = list(
              db.collection("users").document("me").collection("futuresTrades").stream()
          )

          print("AUDIT_OK")
          print("formal_positions=" + json.dumps(account.get("positions") or [], ensure_ascii=False, separators=(",", ":")))
          print("formal_account_asof=" + str(account.get("asof")))
          print("legacy_position_count=" + str(len(legacy_docs)))
          for i, d in enumerate(legacy_docs):
              x = d.to_dict() or {}
              print("LEGACY_" + str(i) + "=" + json.dumps({
                  "id": d.id,
                  "type": x.get("type"),
                  "lots": x.get("lots"),
                  "entry_price": x.get("entry_price"),
                  "date": x.get("date"),
                  "note": x.get("note"),
              }, ensure_ascii=False, separators=(",", ":")))
          print("realized_count=" + str(len(realized_docs)))
          for i, d in enumerate(realized_docs):
              x = d.to_dict() or {}
              print("REALIZED_" + str(i) + "=" + json.dumps({
                  "id": d.id,
                  "date": x.get("date"),
                  "type": x.get("type"),
                  "month": x.get("month"),
                  "lots": x.get("lots"),
                  "entry_price": x.get("entry_price"),
                  "exit_price": x.get("exit_price"),
                  "pnl_twd": x.get("pnl_twd"),
                  "source": x.get("source"),
              }, ensure_ascii=False, separators=(",", ":")))
          print("futures_trade_count=" + str(len(trade_docs)))
          PY
