name: Strategy 4 Production Forward Final2 Acceptance
on:
  push:
    branches: [acceptance/strategy4-production-forward-final2-2026-10-05]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check defense.js
          node --check defense-auth.js
          node --check defense-data.js
          node --check defense-margin-guide.js
          node --check scripts/defense-snapshot.cjs
          node --check scripts/defense-quotes.cjs
          node -e "const c=require('./defense-config.js');if(c.mode!=='production')throw new Error('not production')"
          node --test tests/defense-production-forward.test.cjs
          node --test tests/defense-snapshot.test.cjs
          node --test tests/defense-margin-guidance.test.cjs
          node --test tests/defense-fubon-market.test.cjs
          node --test tests/defense-account-save.test.cjs
          node --test tests/defense-valuation-guidance.test.cjs
          git diff --check HEAD~2 HEAD
