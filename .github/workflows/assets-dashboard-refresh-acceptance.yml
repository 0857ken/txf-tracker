name: Assets Dashboard Refresh Acceptance

on:
  push:
    branches:
      - acceptance/assets-dashboard-refresh-2026-10-06

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard structure tests
        run: node --test tests/assets-dashboard-refresh.test.cjs
      - name: Existing production regressions
        run: |
          node --test tests/defense-margin-guidance.test.cjs
          node --test tests/defense-production-forward.test.cjs
          node --test tests/defense-fubon-market.test.cjs
      - name: No production logic changes
        run: |
          git diff --name-only HEAD~2 HEAD
          test "$(git diff --name-only HEAD~2 HEAD | grep -Ev '^(assets.html|tests/assets-dashboard-refresh.test.cjs|.github/workflows/assets-dashboard-refresh-acceptance.yml)$' | wc -l)" -eq 0
      - run: git diff --check HEAD~2 HEAD
