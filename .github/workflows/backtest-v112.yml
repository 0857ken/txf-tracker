name: Backtest v1.12 signal source compare

on:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v112_signal_source_compare.py'
      - '.github/workflows/backtest-v112.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python research/backtest_v112_signal_source_compare.py
