name: 第4策略隔離驗證
on:
  push:
    branches: ['feature/0050-defense-forward']
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Core, transaction, and existing UI regression tests
        run: |
          npm ci --prefix tools/defense-runner --ignore-scripts --no-audit --no-fund
          node scripts/defense-preview.cjs
          node --test tests/*.test.cjs
      - name: Existing Python tests and syntax
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q scripts
      - name: Produce isolated demonstration preview
        run: |
          node scripts/defense-preview.cjs
          node scripts/defense-examples.cjs
      - name: Real local Firestore emulator transaction verification
        run: |
          npm ci --prefix tools/defense-emulator --ignore-scripts --no-audit --no-fund
          tools/defense-emulator/node_modules/.bin/firebase emulators:exec --only firestore --project demo-txf-defense --config tools/defense-emulator/firebase.json 'node tests/defense-emulator.cjs'
      - uses: actions/upload-artifact@v4
        with:
          name: defense-preview
          path: |
            test-results/defense-preview.html
            test-results/defense-round2-examples.json
            test-results/defense-firestore-example.json
          retention-days: 14
