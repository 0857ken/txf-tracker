name: Backtest v1.13 practical stress

on:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v113_practical_stress.py'
      - 'research/V113_PROTOCOL.md'
      - '.github/workflows/backtest-v113.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python research/backtest_v113_practical_stress.py
