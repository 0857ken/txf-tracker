name: Firebase Rules Principal Audit

on:
  push:
    branches:
      - acceptance/firebase-rules-principal-audit-v3-2026-10-05

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Print non-secret service account identity
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python3 - <<'PY'
import json, os
j=json.loads(os.environ['FIREBASE_KEY'])
print('project_id='+j.get('project_id',''))
print('client_email='+j.get('client_email',''))
PY
