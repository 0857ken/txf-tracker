name: Probe TAIFEX futures open header
on:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/probe_fut_open_header.py'
      - '.github/workflows/probe-fut-open-header.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python research/probe_fut_open_header.py
