name: Backtest v1.8 walk-forward

on:
  workflow_dispatch:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v18_walkforward.py'
      - '.github/workflows/backtest-v18.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python research/backtest_v18_walkforward.py
