name: Backtest C filters v1.2

on:
  push:
    branches:
      - backtest-v1
    paths:
      - 'research/backtest_c_filters_v12.py'
      - '.github/workflows/backtest-v12.yml'

jobs:
  backtest-c-filters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Run filter search
        run: python research/backtest_c_filters_v12.py
