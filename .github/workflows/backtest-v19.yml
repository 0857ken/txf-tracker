name: Backtest v1.9 00685L hybrid
on:
  push:
    branches: [backtest-v1]
    paths:
      - research/backtest_v19_00685l_hybrid.py
      - .github/workflows/backtest-v19.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python research/backtest_v19_00685l_hybrid.py
