name: Futures Price Source Audit

on:
  push:
    branches:
      - acceptance/futures-price-source-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed futures price branch
        uses: actions/checkout@v4
        with:
          ref: feature/official-futures-market-2026-10-12
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and unit tests
        run: |
          node --check scripts/defense-quotes.cjs
          node --check scripts/fetch_futures_market.cjs
          node --check positions.js
          python -m py_compile scripts/snapshot_assets.py
          node --test tests/defense-snapshot.test.cjs

      - name: Fetch same-day official TAIFEX settlements
        run: |
          node scripts/fetch_futures_market.cjs --strict
          node - <<'JS'
          const fs = require('node:fs');
          const fubon = JSON.parse(fs.readFileSync('data/fubon_market_data.json','utf8'));
          const fut = JSON.parse(fs.readFileSync('data/futures_market.json','utf8'));
          if (fut.date !== fubon.quote.date) throw new Error('futures cache date mismatch');
          for (const p of ['TX','MTX','TMF']) {
            if (!fut.rows.some(x => x.product === p && x.date === fut.date && Number(x.mark) > 0))
              throw new Error('missing ' + p);
          }
          const held = fut.rows.find(x => x.product === 'TMF' && x.month === '2026-10');
          if (!held) throw new Error('missing held TMF contract');
          console.log('CACHE_DATE=' + fut.date);
          console.log('CACHE_ROWS=' + fut.rows.length);
          console.log('CACHE_TMF_2026_10=' + held.mark);
          console.log('CACHE_TMF_SOURCE=' + held.source);
          console.log('FUTURES_JSON=' + JSON.stringify(fut));
          JS

      - name: Verify Strategy 4 market adapter uses same-day official futures
        run: |
          node - <<'JS'
          const {fetchMarket} = require('./scripts/defense-quotes.cjs');
          fetchMarket(new Date().toISOString()).then(m => {
            if (!m.futures.length) throw new Error('same-day futures missing');
            if (m.futures.some(x => x.date !== m.date)) throw new Error('stale futures accepted');
            const held = m.futures.find(x => x.product === 'TMF' && x.month === '2026-10');
            if (!held) throw new Error('held TMF quote missing');
            console.log('ADAPTER_DATE=' + m.date);
            console.log('ADAPTER_FUTURES_ROWS=' + m.futures.length);
            console.log('ADAPTER_TMF_2026_10=' + held.mark);
            console.log('ADAPTER_SOURCE=' + held.source);
          }).catch(e => { console.error(e); process.exit(1); });
          JS

      - name: Install Firestore SDK
        run: pip install firebase-admin

      - name: Read-only NAV dry run with current official futures cache
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib

          p = pathlib.Path("scripts/snapshot_assets.py")
          spec = importlib.util.spec_from_file_location("snapshot_assets", p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          market = m.load_json("data/market_data.json")
          prices = m.load_json("data/stock_prices.json")
          fubon = m.load_json("data/fubon_market_data.json")
          futures_cache = m.load_json("data/futures_market.json")
          expected = fubon["quote"]["date"]

          db = m.init_db()
          legacy = m.read_collection(db, "positions")
          futures = m.load_futures_master(
              db,
              legacy,
              futures_cache=futures_cache,
              expected_date=expected,
          )
          stocks = m.read_collection(db, "stocks")
          customs = m.read_collection(db, "customAssets")
          realized = m.read_collection(db, "realizedPnl")
          snap = m.build_snapshot(
              market,
              prices,
              futures,
              stocks,
              customs,
              realized,
              m.datetime.now(m.TW_TZ),
          )

          held = futures["positions"][0]
          cache_mark = next(
              x["mark"] for x in futures_cache["rows"]
              if x["product"] == held["product"] and x["month"] == held["month"]
          )
          if held["current_price"] != cache_mark:
              raise SystemExit("DRY_RUN_FAIL stale price selected")
          if futures.get("market_date") != expected:
              raise SystemExit("DRY_RUN_FAIL date mismatch")
          if snap["realized_pnl"] != -4980:
              raise SystemExit("DRY_RUN_FAIL realized PnL mismatch")
          print("NAV_DRY_RUN_OK")
          print("NAV_PRICE_DATE=" + str(futures["market_date"]))
          print("NAV_FUTURES_PRICE=" + str(held["current_price"]))
          print("NAV_FUTURES_SOURCE=" + str(held["price_source"]))
          print("NAV_NET_WORTH=" + str(snap["net_worth"]))
          print("NAV_REALIZED_PNL=" + str(snap["realized_pnl"]))
          PY
