name: Backtest v1.6 leverage search

on:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/backtest_v16_leverage_search.py'
      - '.github/workflows/backtest-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python research/backtest_v16_leverage_search.py
