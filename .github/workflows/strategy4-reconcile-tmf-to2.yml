name: Strategy 4 Reconcile TMF To 2 Lots

on:
  push:
    branches:
      - ops/strategy4-reconcile-2lots-2026-10-07
    paths:
      - '.github/workflows/strategy4-reconcile-tmf-to2.yml'
      - 'tools/reconcile-strategy4-tmf-to2.cjs'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix prod/tools/defense-runner --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Guarded account reconciliation to two lots
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node tools/reconcile-strategy4-tmf-to2.cjs
