name: Backtest v1.25 position no-trade band
on:
  workflow_dispatch:
  push:
    branches: [backtest-v1]
    paths:
      - 'research/V125_POSITION_BAND_PROTOCOL.md'
      - 'research/backtest_v125_position_band.py'
      - '.github/workflows/backtest-v125.yml'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests beautifulsoup4 yfinance
      - run: python research/backtest_v125_position_band.py
