name: 更新策略資料

on:
  schedule:
    # 每天台灣 14:00(收盤後) = UTC 06:00,週一到五
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取策略資料
        run: python scripts/fetch_strategy.py

      - name: Commit 更新的 JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strategy_data.json
          if git diff --staged --quiet; then
            echo "無變化"
          else
            git commit -m "chore: 自動更新策略資料 [skip ci]"
            git pull --rebase origin gh-pages && git push origin gh-pages
          fi
