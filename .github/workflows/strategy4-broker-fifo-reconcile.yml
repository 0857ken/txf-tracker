name: Strategy 4 Broker FIFO Reconciliation

on:
  push:
    branches:
      - ops/strategy4-broker-fifo-reconcile-2026-10-11
    paths:
      - '.github/workflows/strategy4-broker-fifo-reconcile.yml'
      - 'tools/reconcile-strategy4-broker-summary.cjs'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix prod/tools/defense-runner --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Guarded broker FIFO reconciliation
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node tools/reconcile-strategy4-broker-summary.cjs
