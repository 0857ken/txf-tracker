<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>Firebase 連線測試</title></head>
<body style="font-family:monospace;padding:20px;background:#0a1929;color:#e0e0e0">
<h2>Firebase 連線測試</h2>
<div id="status">初始化中...</div>
<button id="writeBtn" style="margin-top:16px;padding:8px 16px">寫入測試資料</button>
<div id="result" style="margin-top:16px"></div>

<script type="module">
import { collection, addDoc, getDocs } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import './firebase-init.js';

const statusEl = document.getElementById('status');

// 等匿名登入完成
const uid = await window.fbReady;
statusEl.innerHTML = '✅ 已連線 Firebase<br>你的匿名 UID: ' + uid;

document.getElementById('writeBtn').onclick = async () => {
  const resultEl = document.getElementById('result');
  try {
    // 寫入一筆測試資料
    const ref = collection(window.fbDb, 'users', 'me', 'test');
    await addDoc(ref, { msg: '測試成功', time: new Date().toISOString() });
    resultEl.innerHTML = '✅ 寫入成功!正在讀取...';

    // 讀回來
    const snap = await getDocs(ref);
    let html = '✅ 讀取成功,共 ' + snap.size + ' 筆:<br>';
    snap.forEach(d => { html += JSON.stringify(d.data()) + '<br>'; });
    resultEl.innerHTML = html;
  } catch (e) {
    resultEl.innerHTML = '❌ 錯誤: ' + e.message;
    console.error(e);
  }
};
</script>
</body>
</html>
