<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產總覽追蹤</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #141925;
    --bg3: #1a2030;
    --text: #e8eaed;
    --muted: #6b7280;
    --border: #252d3d;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --red: #ff3d00;
    --green: #00c853;
    --blue: #2196f3;
    --yellow: #ffd32a;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--blue); letter-spacing: 2px; }
  .nav { display: flex; gap: 16px; }
  .nav a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav a.active { color: var(--blue); border-bottom: 1px solid var(--blue); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .value { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
  input { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 6px; color: var(--text); font-family: var(--mono); font-size: 12px; }
  button { background: rgba(61, 158, 255, 0.7); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 0 2px; }
  button.red { background: rgba(255, 71, 87, 0.7); color: #fff; }
  .range-btn { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); padding: 4px 12px; font-size: 11px; }
  .range-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
@media(max-width:768px){header{flex-wrap:wrap;gap:12px}.nav{flex-wrap:wrap;gap:12px}}

/* Mobile containment + app-like navigation. */
html, body { max-width:100%; overflow-x:hidden; }
main, .card, .grid-2 { min-width:0; }
canvas { max-width:100%; }
.app-topbar,.bottom-nav { display:none; }
@media(max-width:768px){
  header { display:none; }
  body { background:#000; }
  main { width:100%; max-width:100%; padding:14px 14px 108px; overflow-x:hidden; }
  .grid-2 { grid-template-columns:1fr; gap:12px; margin-bottom:12px; }
  .card { width:100%; max-width:100%; overflow:hidden; border-radius:20px; padding:18px 16px; margin-bottom:14px; }
  .value { font-size:22px; }
  .app-topbar { display:flex; position:sticky; top:0; z-index:20; align-items:center; justify-content:space-between; padding:16px 16px 8px; background:rgba(0,0,0,.88); backdrop-filter:blur(16px); }
  .app-topbar .app-title { font-size:30px; font-weight:800; letter-spacing:-.04em; }
  .app-actions { display:flex; gap:8px; }
  .app-actions button,.app-actions a { width:42px; height:42px; display:grid; place-items:center; padding:0; margin:0; border-radius:50%; border:1px solid #3a3a3c; background:#171719; color:#fff; text-decoration:none; font-size:18px; }
  .bottom-nav { display:grid; grid-template-columns:repeat(5,1fr); position:fixed; z-index:30; left:14px; right:14px; bottom:12px; padding:9px 6px 8px; border-radius:28px; background:rgba(31,31,33,.94); border:1px solid #454549; box-shadow:0 18px 50px rgba(0,0,0,.5); backdrop-filter:blur(18px); }
  .bottom-nav a { min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; color:#c7c7cc; text-decoration:none; font-size:11px; }
  .bottom-nav a .nav-icon { font-size:21px; line-height:1.2; }
  .bottom-nav a.active { color:#f0cc69; }

  table.mobile-cards { width:100%; display:block; }
  table.mobile-cards thead { display:none; }
  table.mobile-cards tbody { display:block; width:100%; }
  table.mobile-cards tr { display:block; width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:16px; padding:10px 12px; margin-bottom:10px; }
  table.mobile-cards td { display:grid; grid-template-columns:92px minmax(0,1fr); align-items:start; gap:10px; width:100%; max-width:100%; padding:7px 0; border:0; overflow-wrap:anywhere; word-break:break-word; }
  table.mobile-cards td::before { color:var(--muted); font-size:11px; line-height:1.5; }
  table.mobile-cards td:nth-child(1)::before { content:'代號'; }
  table.mobile-cards td:nth-child(2)::before { content:'名稱'; }
  table.mobile-cards td:nth-child(3)::before { content:'股數／口數'; }
  table.mobile-cards td:nth-child(4)::before { content:'成本價'; }
  table.mobile-cards td:nth-child(5)::before { content:'現價'; }
  table.mobile-cards td:nth-child(6)::before { content:'損益'; }
  table.mobile-cards td:nth-child(7)::before { content:'提醒上限'; }
  table.mobile-cards td:nth-child(8)::before { content:'提醒下限'; }
  table.mobile-cards td:nth-child(9)::before { content:'操作'; }
  table.mobile-cards td:nth-child(9) { display:flex; flex-wrap:wrap; gap:6px; padding-top:10px; border-top:1px solid var(--border); }
  table.mobile-cards td:nth-child(9)::before { flex:0 0 92px; }
  table.mobile-cards input { width:100% !important; min-width:0; font-size:16px; }
  table.mobile-cards button { margin:0; }

  table.add-position { display:block; width:100%; }
  table.add-position tbody, table.add-position tr { display:block; width:100%; }
  table.add-position td { display:block; width:100%; padding:7px 0; border:0; font-size:12px; }
  table.add-position input, table.add-position select { display:block; width:100% !important; max-width:100%; margin-top:5px; padding:10px; font-size:16px !important; border-radius:10px !important; }
  table.add-position button { width:100%; min-height:42px; margin:4px 0 0; border-radius:10px; font-size:14px; }
  dialog { width:calc(100vw - 28px) !important; min-width:0 !important; max-width:calc(100vw - 28px) !important; }
}

</style>
</head>
<body>
<div class="app-topbar">
  <div class="app-title">資產總覽</div>
  <div class="app-actions">
    <button type="button" onclick="loadStocks()" aria-label="刷新">↻</button>
    <a href="assets.html" aria-label="儀表板">◔</a>
  </div>
</div>
<header>
  <div class="logo">TXF TRACKER · 資產總覽</div>
  <nav class="nav">
    <a href="index.html">微台期</a>
    <a href="stocks.html" class="active">資產總覽</a>
    <a href="assets.html">200萬計畫</a>
<a href="strategy.html">策略</a>
    <a href="follow.html">跟單配置</a>
  </nav>
  <button onclick="loadStocks()" style="background:var(--blue);padding:8px 16px;border-radius:6px">刷新</button>
</header>

<main>
  <div class="grid-2">
    <div class="card">
      <div class="label">總市值</div>
      <div class="value blue" id="total-value">—</div>
      <div class="sub">所有持倉合計</div>
    </div>
    <div class="card">
      <div class="label">歷史資產變化</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="changeRange('day')" id="btn-day" class="range-btn">日</button>
        <button onclick="changeRange('week')" id="btn-week" class="range-btn">週</button>
        <button onclick="changeRange('month')" id="btn-month" class="range-btn">月</button>
      </div>
      <div style="height:180px;position:relative"><canvas id="history-chart"></canvas></div>
    </div>
  </div>

  <div class="card">
    <div class="label">資產明細（股票/ETF/基金）</div>
    <table class="mobile-cards">
      <thead><tr><th>代號</th><th>名稱</th><th>股數</th><th>成本價</th><th>現價</th><th>損益(%)</th><th>提醒上限</th><th>提醒下限</th><th>操作</th></tr></thead>
      <tbody id="stock-tbody"><tr><td colspan="9">載入中...</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="label">新增持倉</div>
    <table class="add-position">
      <tr>
        <td>類別: <select id="new-type" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px;font-family:var(--mono);font-size:12px">
          <option value="stock">股票/ETF</option>
          <option value="fund">基金</option>
        </select></td>
        <td>代號/名稱: <input type="text" id="new-symbol" placeholder="2330 或 基金名" style="width:120px"></td>
        <td>股數/單位: <input type="number" id="new-shares" step="0.01" placeholder="100" style="width:80px"></td>
        <td>成本價/淨值: <input type="number" id="new-cost" step="0.0001" placeholder="600" style="width:80px"></td>
        <td>提醒上限: <input type="number" id="new-high" step="0.1" placeholder="700" style="width:80px"></td>
        <td>提醒下限: <input type="number" id="new-low" step="0.1" placeholder="500" style="width:80px"></td>
        <td><button onclick="addStock()">新增</button></td>
      </tr>
    </table>
  </div>
</main>
<nav class="bottom-nav" aria-label="主要導覽">
  <a href="index.html"><span class="nav-icon">⌁</span><span>期貨</span></a>
  <a href="stocks.html" class="active"><span class="nav-icon">▣</span><span>股票</span></a>
  <a href="assets.html"><span class="nav-icon">◔</span><span>儀表板</span></a>
  <a href="strategy.html"><span class="nav-icon">◫</span><span>策略庫</span></a>
  <a href="follow.html"><span class="nav-icon">↗</span><span>跟單</span></a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script type="module" src="firebase-init.js"></script>
<script type="module" src="stocks-data.js"></script>
<script type="module" src="positions.js"></script>
<script>
// 合約乘數(台指期)
const TXF_MULT = { TXF: 200, MXF: 50, TMF: 10, '大台': 200, '小台': 50, '微台': 10 };


async function editCustomAsset(id) {
  try {
    const list = await window.fetchCustomAssets();
    const a = list.find(x => x.id === id);
    if (!a) return alert('找不到資產');
    const dialog = document.getElementById('custom-edit-dialog');
    document.getElementById('custom-name').value = a.name || '';
    document.getElementById('custom-type').value = a.type || '';
    document.getElementById('custom-shares').value = a.shares || '';
    document.getElementById('custom-cost').value = a.cost || '';
    document.getElementById('custom-value').value = a.value || '';
    document.getElementById('custom-high').value = a.alert_high || '';
    document.getElementById('custom-low').value = a.alert_low || '';
    dialog.showModal();
    document.getElementById('custom-confirm').onclick = async () => {
      const name = document.getElementById('custom-name').value;
      const type = document.getElementById('custom-type').value;
      const shares = parseFloat(document.getElementById('custom-shares').value) || 0;
      const cost = parseFloat(document.getElementById('custom-cost').value) || 0;
      const value = parseFloat(document.getElementById('custom-value').value);
      const hVal = document.getElementById('custom-high').value;
      const lVal = document.getElementById('custom-low').value;
      const alert_high = hVal === '' ? null : parseFloat(hVal);
      const alert_low = lVal === '' ? null : parseFloat(lVal);
      if (!name || !type || !value) return alert('項目、類別、市值為必填');
      await window.updateCustomAssetFS(id, {name, type, shares, cost, value, alert_high, alert_low});
      dialog.close();
      loadStocks();
    };
  } catch (e) { alert('更新失敗'); }
}

async function toggleCustomNotify(id, currentlyEnabled) {
  try {
    await window.updateCustomAssetFS(id, { notify_enabled: !currentlyEnabled });
    loadStocks();
  } catch (e) { alert('切換失敗'); }
}

async function deleteCustomAsset(id) {
  if (!confirm('確定刪除這筆自訂資產？')) return;
  try {
    await window.deleteCustomAssetFS(id);
    loadStocks();
  } catch (e) { alert('刪除失敗'); }
}

async function loadStocks() {
  try {
    const [stocks, customs, prices, futuresMaster] = await Promise.all([
      window.fetchStocks(),
      window.fetchCustomAssets(),
      window.fetchStockPrices(),
      window.fetchFuturesMaster()
    ]);

    let totalValue = 0;

    // 台指期列：只讀 0050 變速防守正式主帳。
    let txfRows = '';
    const positions = futuresMaster.positions || [];
    positions.forEach(p => {
      const mult = TXF_MULT[p.type] || 10;
      const curPrice = Number(p.current_price);
      const entry = Number(p.entry_price);
      const hasPrice = Number.isFinite(curPrice) && curPrice > 0;
      const hasCost = p.cost_valid && Number.isFinite(entry) && entry > 0;
      const value = hasPrice ? curPrice * mult * p.lots : 0;
      if (hasPrice) totalValue += value;

      const pnl = hasPrice && hasCost ? Math.round((curPrice - entry) * mult * p.lots) : null;
      const costNotional = hasCost ? entry * mult * p.lots : null;
      const pnlPct = pnl !== null && costNotional ? ((pnl / costNotional) * 100).toFixed(2) : null;
      const color = pnl === null ? '' : (pnl >= 0 ? 'red' : 'green');
      const pnlText = pnl === null ? '待成本核對' : (pnl >= 0 ? '+' : '') + pnl.toLocaleString() + ' (' + pnlPct + '%)';

      txfRows += '<tr style="opacity:0.85">' +
        '<td>' + p.type + '</td>' +
        '<td>台指期 ' + (p.month || '') + '</td>' +
        '<td>' + p.lots + ' 口</td>' +
        '<td>' + (hasCost ? entry.toLocaleString() : '—') + '</td>' +
        '<td>' + (hasPrice ? curPrice.toLocaleString() : '—') + '</td>' +
        '<td class="' + color + '">' + pnlText + '</td>' +
        '<td>—</td><td>—</td>' +
        '<td><a href="defense.html#positions" style="color:var(--blue);text-decoration:none">正式主帳 ↗</a></td>' +
        '</tr>';
    });

    // 自訂資產列
    let customRows = '';
    customs.forEach(a => {
      const hasFullData = a.shares && a.cost;
      const marketValue = hasFullData ? a.shares * a.value : a.value;
      totalValue += marketValue;
      const realPnl = hasFullData ? marketValue - a.shares * a.cost : 0;
      const realPnlPct = hasFullData ? ((realPnl / (a.shares * a.cost)) * 100).toFixed(2) : 0;
      const realColor = realPnl >= 0 ? 'red' : 'green';
      const notifyOn = a.notify_enabled !== false;
      customRows += '<tr style="opacity:0.85"><td>' + a.name + '</td><td>' + a.type + '</td><td>' + (hasFullData ? a.shares : '-') + '</td><td>' + (hasFullData ? a.cost.toLocaleString() : '-') + '</td><td>' + (a.value != null ? a.value.toLocaleString() : '-') + '</td><td class="' + (hasFullData ? realColor : '') + '">' + (hasFullData ? (realPnl >= 0 ? '+' : '') + Math.round(realPnl).toLocaleString() + ' (' + realPnlPct + '%)' : '-') + '</td><td>' + (a.alert_high || '-') + '</td><td>' + (a.alert_low || '-') + '</td><td><button onclick="editCustomAsset(\'' + a.id + '\')" style="background:var(--blue);font-size:11px;margin-right:4px">✏️ 編輯</button><button onclick="toggleCustomNotify(\'' + a.id + '\', ' + notifyOn + ')" style="background:' + (notifyOn ? 'var(--green)' : 'var(--muted)') + ';font-size:11px;margin-right:4px">' + (notifyOn ? '🔔' : '🔕') + '</button><button onclick="deleteCustomAsset(\'' + a.id + '\')" class="red">刪除</button></td></tr>';
    });

    // 股票列(現價從 stock_prices.json)
    const tbody = document.getElementById('stock-tbody');
    if (stocks.length === 0 && !txfRows && !customRows) {
      tbody.innerHTML = '<tr><td colspan="9" style="color:var(--muted)">尚無持倉,用下方表單新增</td></tr>';
    } else {
      const stockRows = stocks.map(s => {
        const isFund = s.is_fund || (s.symbol || '').startsWith('FUND:');
        const priceInfo = prices[s.symbol] || {};
        const curPrice = isFund ? (s.current_price || 0) : (priceInfo.price || s.current_price || 0);
        const value = curPrice * s.shares;
        totalValue += value;
        const cost = s.cost_price * s.shares;
        const pnl = curPrice ? Math.round(value - cost) : 0;
        const pnlPct = cost ? ((pnl / cost) * 100).toFixed(2) : '0';
        const pnlColor = pnl >= 0 ? 'red' : 'green';
        const notifyOn = s.notify_enabled !== false;
        const priceCell = isFund
          ? '<input type="number" step="0.0001" value="' + (s.current_price || '') + '" style="width:80px" onchange="updatePrice(\'' + s.id + '\', this.value)">'
          : (curPrice ? curPrice.toLocaleString() : '—');
        return '<tr><td>' + (s.symbol || '').replace('FUND:', '') + '</td><td>' + (s.name || '—') + '</td><td>' + s.shares + '</td><td>' + s.cost_price.toLocaleString() + '</td><td>' + priceCell + '</td><td class="' + pnlColor + '">' + (curPrice ? (pnl >= 0 ? '+' : '') + pnl.toLocaleString() + ' (' + pnlPct + '%)' : '—') + '</td><td>' + (s.alert_high || '—') + '</td><td>' + (s.alert_low || '—') + '</td><td><button onclick="editStockAlert(\'' + s.id + '\', ' + s.shares + ', ' + s.cost_price + ', ' + (s.alert_high || 'null') + ', ' + (s.alert_low || 'null') + ')" style="background:var(--blue);font-size:11px;margin-right:4px">✏️ 編輯</button><button onclick="toggleNotify(\'' + s.id + '\', ' + notifyOn + ')" style="background:' + (notifyOn ? 'var(--green)' : 'var(--muted)') + ';font-size:11px;margin-right:4px">' + (notifyOn ? '🔔' : '🔕') + '</button><button onclick="deleteStock(\'' + s.id + '\')" class="red">刪除</button></td></tr>';
      }).join('');
      tbody.innerHTML = txfRows + customRows + stockRows;
    }

    const totalEl = document.getElementById('total-value');
    if (totalEl) totalEl.textContent = Math.round(totalValue).toLocaleString() + ' 元';
  } catch (e) {
    console.error('Error:', e);
  }
}

async function addStock() {
  const type = document.getElementById('new-type').value;
  const symbol = document.getElementById('new-symbol').value.trim();
  const shares = parseFloat(document.getElementById('new-shares').value);
  const cost = parseFloat(document.getElementById('new-cost').value);
  const high = parseFloat(document.getElementById('new-high').value) || null;
  const low = parseFloat(document.getElementById('new-low').value) || null;

  if (!symbol || !shares || !cost) return alert('請填寫代號、股數和成本價');

  const isFund = type === 'fund';
  const finalSymbol = isFund ? 'FUND:' + symbol : symbol;

  try {
    await window.addStockFS({
      symbol: finalSymbol,
      name: isFund ? symbol : symbol,
      shares, cost_price: cost,
      alert_high: high, alert_low: low,
      notify_enabled: true,
      is_fund: isFund,
      market: 'TW',
      current_price: null
    });
    alert('已新增');
    ['new-symbol','new-shares','new-cost','new-high','new-low'].forEach(id => document.getElementById(id).value = '');
    loadStocks();
  } catch (e) {
    alert('新增失敗: ' + e.message);
  }
}

async function updatePrice(id, price) {
  try {
    await window.updateStockFS(id, { current_price: parseFloat(price) });
    loadStocks();
  } catch (e) {
    alert('更新失敗');
  }
}

async function editStockAlert(id, currentShares, currentCost, currentHigh, currentLow) {
  const dialog = document.getElementById('alert-edit-dialog');
  const confirmBtn = document.getElementById('alert-confirm');

  document.getElementById('alert-shares').value = currentShares;
  document.getElementById('alert-cost').value = currentCost;
  document.getElementById('alert-high').value = currentHigh !== null ? currentHigh : '';
  document.getElementById('alert-low').value = currentLow !== null ? currentLow : '';
  dialog.showModal();

  confirmBtn.onclick = async () => {
    const sharesVal = document.getElementById('alert-shares').value;
    const costVal = document.getElementById('alert-cost').value;
    const highVal = document.getElementById('alert-high').value;
    const lowVal = document.getElementById('alert-low').value;

    if (sharesVal === '' || costVal === '') {
      alert('股數跟成本價必填');
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = '儲存中...';

    try {
      const body = {
        shares: parseFloat(sharesVal),
        cost_price: parseFloat(costVal),
        alert_high: highVal === '' ? null : parseFloat(highVal),
        alert_low: lowVal === '' ? null : parseFloat(lowVal)
      };
      await window.updateStockFS(id, body);
      dialog.close();
      loadStocks();
    } catch (e) {
      alert('儲存失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '儲存';
    }
  };
}

async function toggleNotify(id, currentlyEnabled) {
  try {
    await window.updateStockFS(id, { notify_enabled: !currentlyEnabled });
    loadStocks();
  } catch (e) {
    alert('切換失敗：' + e.message);
  }
}

async function deleteStock(id) {
  if (!confirm('確定刪除？')) return;
  try {
    await window.deleteStockFS(id);
    loadStocks();
  } catch (e) {
    alert('刪除失敗');
  }
}

let historyChart = null;
let currentRange = 'day';

async function loadHistory() {
  try {
    const snapshots = [];  // 歷史快照功能建置中(需 GitHub Actions 每日寫入)

    let filtered = snapshots;
    const now = new Date();
    if (currentRange === 'day') {
      filtered = snapshots.slice(-7);
    } else if (currentRange === 'week') {
      filtered = snapshots.slice(-30);
    } else if (currentRange === 'month') {
      filtered = snapshots.slice(-90);
    }

    const ctx = document.getElementById('history-chart').getContext('2d');
    if (historyChart) historyChart.destroy();
    historyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: filtered.map(s => s.date.slice(5)),
        datasets: [{
          label: '未實現損益',
          data: filtered.map(s => s.unrealized_pnl),
          borderColor: '#3d9eff',
          backgroundColor: 'rgba(61, 158, 255, 0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#4a6070' }, grid: { color: '#1e3048' } },
          x: { ticks: { color: '#4a6070' }, grid: { display: false } }
        }
      }
    });
  } catch (e) {
    console.error('History error:', e);
  }
}

function changeRange(range) {
  currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + range).classList.add('active');
  loadHistory();
}

(function waitInit(){ if(window.fetchStocks && window.fetchFuturesMaster){ loadStocks(); loadHistory(); document.getElementById("btn-day").classList.add("active"); setInterval(loadStocks,60000);} else { setTimeout(waitInit,100);} })();
</script>
