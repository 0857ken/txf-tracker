<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產總覽追蹤</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #141925;
    --bg3: #1a2030;
    --text: #e8eaed;
    --muted: #6b7280;
    --border: #252d3d;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --red: #ff3d00;
    --green: #00c853;
    --blue: #2196f3;
    --yellow: #ffd32a;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--blue); letter-spacing: 2px; }
  .nav { display: flex; gap: 16px; }
  .nav a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav a.active { color: var(--blue); border-bottom: 1px solid var(--blue); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .value { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
  input { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 6px; color: var(--text); font-family: var(--mono); font-size: 12px; }
  button { background: rgba(61, 158, 255, 0.7); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 0 2px; }
  button.red { background: rgba(255, 71, 87, 0.7); color: #fff; }
  .range-btn { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); padding: 4px 12px; font-size: 11px; }
  .range-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
</style>
</head>
<body>
<header>
  <div class="logo">TXF TRACKER · 資產總覽</div>
  <nav class="nav">
    <a href="index.html">微台期</a>
    <a href="stocks.html" class="active">資產總覽</a>
    <a href="assets.html">200萬計畫</a>
  </nav>
  <button onclick="loadStocks()" style="background:var(--blue);padding:8px 16px;border-radius:6px">刷新</button>
</header>

<main>
  <div class="grid-2">
    <div class="card">
      <div class="label">總市值</div>
      <div class="value blue" id="total-value">—</div>
      <div class="sub">所有持倉合計</div>
    </div>
    <div class="card">
      <div class="label">歷史資產變化</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="changeRange('day')" id="btn-day" class="range-btn">日</button>
        <button onclick="changeRange('week')" id="btn-week" class="range-btn">週</button>
        <button onclick="changeRange('month')" id="btn-month" class="range-btn">月</button>
      </div>
      <div style="height:180px;position:relative"><canvas id="history-chart"></canvas></div>
    </div>
  </div>

  <div class="card">
    <div class="label">資產明細（股票/ETF/基金）</div>
    <table>
      <thead><tr><th>代號</th><th>名稱</th><th>股數</th><th>成本價</th><th>現價</th><th>損益(%)</th><th>提醒上限</th><th>提醒下限</th><th>操作</th></tr></thead>
      <tbody id="stock-tbody"><tr><td colspan="9">載入中...</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="label">新增持倉</div>
    <table>
      <tr>
        <td>類別: <select id="new-type" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px;font-family:var(--mono);font-size:12px">
          <option value="stock">股票/ETF</option>
          <option value="fund">基金</option>
        </select></td>
        <td>代號/名稱: <input type="text" id="new-symbol" placeholder="2330 或 基金名" style="width:120px"></td>
        <td>股數/單位: <input type="number" id="new-shares" step="0.01" placeholder="100" style="width:80px"></td>
        <td>成本價/淨值: <input type="number" id="new-cost" step="0.0001" placeholder="600" style="width:80px"></td>
        <td>提醒上限: <input type="number" id="new-high" step="0.1" placeholder="700" style="width:80px"></td>
        <td>提醒下限: <input type="number" id="new-low" step="0.1" placeholder="500" style="width:80px"></td>
        <td><button onclick="addStock()">新增</button></td>
      </tr>
    </table>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
const API = 'https://txf-tracker-production.up.railway.app';

async function loadStocks() {
  try {
    const res = await fetch(API + '/api/stocks');
    const stocks = await res.json();
    
    let totalValue = 0;
    
    // 加上台指期市值
    try {
      const txfRes = await fetch(API + '/api/dashboard');
      const txfData = await txfRes.json();
      const currentPrice = txfData.market.current_price;
      txfData.positions.forEach(p => {
        const pointValue = p.type === 'TXF' ? 50 : 10;
        totalValue += currentPrice * pointValue * p.lots;
      });
    } catch (e) { console.error('TXF error:', e); }
    
    // 先加台指期列
    let txfRows = '';
    try {
      const txfRes = await fetch(API + '/api/dashboard');
      const txfData = await txfRes.json();
      const currentPrice = txfData.market.current_price;
      txfData.positions.forEach(p => {
        const pointValue = p.type === 'TXF' ? 50 : 10;
        const cost = p.entry_price * pointValue * p.lots;
        const value = currentPrice * pointValue * p.lots;
        const pnl = p.pnl_twd;
        const pnlPct = ((pnl / cost) * 100).toFixed(2);
        const color = pnl >= 0 ? 'red' : 'green';
        totalValue += value;
        txfRows += `
          <tr style="opacity:0.85">
            <td>${p.type}</td>
            <td>台指期</td>
            <td>${p.lots} 口</td>
            <td>${p.entry_price.toLocaleString()}</td>
            <td>${currentPrice.toLocaleString()}</td>
            <td class="${color}">${(pnl >= 0 ? '+' : '') + pnl.toLocaleString()} (${pnlPct}%)</td>
            <td>—</td><td>—</td><td>—</td>
          </tr>
        `;
      });
    } catch (e) { console.error('TXF error:', e); }
    
    const tbody = document.getElementById('stock-tbody');
    if (stocks.length === 0 && !txfRows) {
      tbody.innerHTML = '<tr><td colspan="9" style="color:var(--muted)">尚無持倉</td></tr>';
    } else {
      tbody.innerHTML = txfRows + stocks.map(s => {
        const value = (s.current_price || 0) * s.shares;
        totalValue += value;
        const pnlColor = (s.pnl_twd || 0) >= 0 ? 'red' : 'green';
        return `
          <tr>
            <td>${s.symbol}</td>
            <td>${s.name || '—'}</td>
            <td>${s.shares}</td>
            <td>${s.cost_price.toLocaleString()}</td>
            <td>${s.symbol.startsWith('FUND:') 
              ? '<input type="number" step="0.0001" value="' + (s.current_price || '') + '" style="width:80px" onchange="updatePrice(' + s.id + ', this.value)">' 
              : (s.current_price ? s.current_price.toLocaleString() : '—')}</td>
            <td class="${pnlColor}">${s.pnl_twd ? (s.pnl_twd >= 0 ? '+' : '') + s.pnl_twd.toLocaleString() + ' (' + s.pnl_pct + '%)' : '—'}</td>
            <td>${s.alert_high || '—'}</td>
            <td>${s.alert_low || '—'}</td>
            <td>
            <button onclick="editStockAlert(${s.id}, ${s.shares}, ${s.cost_price}, ${s.alert_high || 'null'}, ${s.alert_low || 'null'})" style="background:var(--blue);font-size:11px;margin-right:4px">✏️ 編輯</button>
            <button onclick="toggleNotify(${s.id}, ${s.notify_enabled !== false})" style="background:${s.notify_enabled !== false ? 'var(--green)' : 'var(--muted)'};font-size:11px;margin-right:4px" title="${s.notify_enabled !== false ? '通知已開' : '通知已關'}">${s.notify_enabled !== false ? '🔔' : '🔕'}</button>
            <button onclick="deleteStock(${s.id})" class="red">刪除</button>
          </td>
          </tr>
        `;
      }).join('');
    }
    
    const remaining = 2000000 - totalValue;
    const remainingPct = (remaining / 2000000 * 100).toFixed(2);
    document.getElementById('total-value').textContent = Math.round(totalValue).toLocaleString() + ' 元';
    document.getElementById('remaining').textContent = Math.round(remaining).toLocaleString() + ' 元';
    document.getElementById('remaining-pct').textContent = remainingPct + '%';
  } catch (e) {
    console.error('Error:', e);
  }
}

async function addStock() {
  const type = document.getElementById('new-type').value;
  const symbol = document.getElementById('new-symbol').value;
  const shares = parseFloat(document.getElementById('new-shares').value);
  const cost = parseFloat(document.getElementById('new-cost').value);
  const high = parseFloat(document.getElementById('new-high').value) || null;
  const low = parseFloat(document.getElementById('new-low').value) || null;
  
  if (!symbol || !shares || !cost) return alert('請填寫代號、股數和成本價');
  
  // 基金 prefix "FUND:" 讓後端不要去抓股價
  const finalSymbol = type === 'fund' ? 'FUND:' + symbol : symbol;
  
  try {
    const res = await fetch(API + '/api/stocks', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({symbol: finalSymbol, shares, cost_price: cost, alert_high: high, alert_low: low})
    });
    if (res.ok) {
      alert('已新增');
      ['new-symbol','new-shares','new-cost','new-high','new-low'].forEach(id => document.getElementById(id).value = '');
      loadStocks();
    }
  } catch (e) {
    alert('新增失敗: ' + e.message);
  }
}

async function updatePrice(id, price) {
  try {
    await fetch(API + '/api/stocks/' + id + '/price', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({price: parseFloat(price)})
    });
    loadStocks();
  } catch (e) {
    alert('更新失敗');
  }
}



async function editStockAlert(id, currentShares, currentCost, currentHigh, currentLow) {
  const dialog = document.getElementById('alert-edit-dialog');
  const confirmBtn = document.getElementById('alert-confirm');
  
  document.getElementById('alert-shares').value = currentShares;
  document.getElementById('alert-cost').value = currentCost;
  document.getElementById('alert-high').value = currentHigh !== null ? currentHigh : '';
  document.getElementById('alert-low').value = currentLow !== null ? currentLow : '';
  dialog.showModal();
  
  confirmBtn.onclick = async () => {
    const sharesVal = document.getElementById('alert-shares').value;
    const costVal = document.getElementById('alert-cost').value;
    const highVal = document.getElementById('alert-high').value;
    const lowVal = document.getElementById('alert-low').value;
    
    if (sharesVal === '' || costVal === '') {
      alert('股數跟成本價必填');
      return;
    }
    
    confirmBtn.disabled = true;
    confirmBtn.textContent = '儲存中...';
    
    try {
      const body = {
        shares: parseFloat(sharesVal),
        cost_price: parseFloat(costVal),
        alert_high: highVal === '' ? null : parseFloat(highVal),
        alert_low: lowVal === '' ? null : parseFloat(lowVal)
      };
      const res = await fetch(API + '/api/stocks/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('儲存失敗');
      dialog.close();
      loadStocks();
    } catch (e) {
      alert('儲存失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '儲存';
    }
  };
}

async function toggleNotify(id, currentlyEnabled) {
  try {
    const res = await fetch(API + '/api/stocks/' + id + '/notify', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: !currentlyEnabled})
    });
    if (!res.ok) throw new Error('切換失敗');
    loadStocks();
  } catch (e) {
    alert('切換失敗：' + e.message);
  }
}

async function deleteStock(id) {
  if (!confirm('確定刪除？')) return;
  try {
    await fetch(API + '/api/stocks/' + id, {method: 'DELETE'});
    loadStocks();
  } catch (e) {
    alert('刪除失敗');
  }
}

let historyChart = null;
let currentRange = 'day';

async function loadHistory() {
  try {
    const res = await fetch(API + '/api/snapshots');
    const snapshots = await res.json();
    
    let filtered = snapshots;
    const now = new Date();
    if (currentRange === 'day') {
      filtered = snapshots.slice(-7);
    } else if (currentRange === 'week') {
      filtered = snapshots.slice(-30);
    } else if (currentRange === 'month') {
      filtered = snapshots.slice(-90);
    }
    
    const ctx = document.getElementById('history-chart').getContext('2d');
    if (historyChart) historyChart.destroy();
    historyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: filtered.map(s => s.date.slice(5)),
        datasets: [{
          label: '未實現損益',
          data: filtered.map(s => s.unrealized_pnl),
          borderColor: '#3d9eff',
          backgroundColor: 'rgba(61, 158, 255, 0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#4a6070' }, grid: { color: '#1e3048' } },
          x: { ticks: { color: '#4a6070' }, grid: { display: false } }
        }
      }
    });
  } catch (e) {
    console.error('History error:', e);
  }
}

function changeRange(range) {
  currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + range).classList.add('active');
  loadHistory();
}

loadStocks();
loadHistory();
document.getElementById('btn-day').classList.add('active');
setInterval(loadStocks, 60000);
setInterval(loadHistory, 300000);
</script>

<!-- 編輯股票警戒對話框 -->
<dialog id="alert-edit-dialog" style="background:#141925;color:#e8eaed;border:1px solid #252d3d;border-radius:12px;padding:24px;min-width:340px;max-width:90%;box-shadow:0 10px 25px rgba(0,0,0,0.5)">
  <h3 style="margin-top:0;font-size:1.2rem;border-bottom:1px solid #252d3d;padding-bottom:12px;color:#d4af37">編輯股票/警戒</h3>
  <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
    <label style="font-size:0.9rem;color:#6b7280">股數
      <input id="alert-shares" type="number" step="any" inputmode="decimal" style="width:100%;padding:10px;background:#0a0e1a;color:#fff;border:1px solid #252d3d;border-radius:6px;margin-top:4px;font-size:16px">
    </label>
    <label style="font-size:0.9rem;color:#6b7280">成本價
      <input id="alert-cost" type="number" step="any" inputmode="decimal" style="width:100%;padding:10px;background:#0a0e1a;color:#fff;border:1px solid #252d3d;border-radius:6px;margin-top:4px;font-size:16px">
    </label>
    <label style="font-size:0.9rem;color:#6b7280">警戒上限（突破通知）
      <input id="alert-high" type="number" step="any" inputmode="decimal" placeholder="留空=不通知" style="width:100%;padding:10px;background:#0a0e1a;color:#fff;border:1px solid #252d3d;border-radius:6px;margin-top:4px;font-size:16px">
    </label>
    <label style="font-size:0.9rem;color:#6b7280">警戒下限（跌破通知）
      <input id="alert-low" type="number" step="any" inputmode="decimal" placeholder="留空=不通知" style="width:100%;padding:10px;background:#0a0e1a;color:#fff;border:1px solid #252d3d;border-radius:6px;margin-top:4px;font-size:16px">
    </label>
    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
      <button onclick="document.getElementById('alert-edit-dialog').close()" style="background:transparent;color:#6b7280;border:none;cursor:pointer;padding:8px 16px">取消</button>
      <button id="alert-confirm" style="background:#d4af37;color:#0a0e1a;border:none;border-radius:6px;padding:8px 20px;cursor:pointer;font-weight:bold">儲存</button>
    </div>
  </div>
</dialog>

</body>
</html>
