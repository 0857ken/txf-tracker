<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微台期追蹤</title>
<style>
  :root {
    --bg: #0d1b2a; --bg2: #112236; --bg3: #0a1628;
    --text: #c8d8e8; --muted: #4a6070; --border: #1e3048;
    --green: #00e5a0; --red: #ff4757; --blue: #3d9eff;
    --yellow: #ffd32a;
    --sans: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--blue); letter-spacing: 2px; }
  .nav { display: flex; gap: 16px; }
  .nav a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav a.active { color: var(--blue); border-bottom: 1px solid var(--blue); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 20px; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .value { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
</style>
</head>
<body>
<header>
  <div class="logo">TXF TRACKER · 微台期追蹤</div>
  <nav class="nav">
    <a href="index.html" class="active">微台期</a>
    <a href="stocks.html">股票資產</a>
  </nav>
  <div style="display:flex;gap:10px">
    <button onclick="loadDashboard()" style="background:#3d9eff;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-family:var(--mono);cursor:pointer">刷新</button>
  </div>
</header>

<main>
  <div class="grid-4">
    <div class="card">
      <div class="label">台指期數 現價</div>
      <div class="value blue" id="price">—</div>
      <div class="sub" id="data-source">Yahoo Finance</div>
    </div>
    <div class="card">
      <div class="label">未實現損益</div>
      <div class="value" id="pnl">—</div>
      <div class="sub" id="pnl-sub">—</div>
    </div>
    <div class="card">
      <div class="label">目前持倉口數</div>
      <div class="value blue" id="lots">—</div>
      <div class="sub" id="lots-sub">—</div>
    </div>
    <div class="card">
      <div class="label">均線狀態</div>
      <div class="value" id="ma-state" style="color:var(--yellow)">—</div>
      <div class="sub" id="ma-mode">—</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="label">近 30 日收盤走勢</div>
      <div style="height:220px;position:relative"><canvas id="chart"></canvas></div>
    </div>
    <div class="card">
      <div class="label">均線明細 & 狀態</div>
      <table>
        <tr><th>均線</th><th>自動抓取</th><th>狀態</th></tr>
        <tr><td>5日</td><td id="ma5">—</td><td>—</td></tr>
        <tr><td>20日(月線)</td><td id="ma20">—</td><td>—</td></tr>
        <tr><td>60日(季線)</td><td id="ma60">—</td><td>—</td></tr>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="label">部位明細</div>
    <table>
      <thead><tr><th>日期</th><th>種類</th><th>口數</th><th>進場點</th><th>現價損益(元)</th><th>備註</th></tr></thead>
      <tbody id="pos-tbody"><tr><td colspan="6">載入中...</td></tr></tbody>
    </table>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
const API = 'https://txf-tracker-production.up.railway.app';
let chart = null;

async function loadDashboard() {
  try {
    const res = await fetch(API + '/api/dashboard');
    if (!res.ok) throw new Error('API 錯誤');
    const data = await res.json();
    
    document.getElementById('price').textContent = data.market.current_price.toLocaleString();
    document.getElementById('data-source').textContent = data.market.data_source + ' · ' + new Date().toLocaleTimeString('zh-TW');
    
    const pnl = data.total_pnl_twd;
    const pnlEl = document.getElementById('pnl');
    pnlEl.className = 'value ' + (pnl >= 0 ? 'green' : 'red');
    pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toLocaleString() + ' 元';
    
    document.getElementById('ma5').textContent = data.market.ma5.toLocaleString();
    document.getElementById('ma20').textContent = data.market.ma20.toLocaleString();
    document.getElementById('ma60').textContent = data.market.ma60.toLocaleString();
    
    document.getElementById('ma-state').textContent = data.ma_state.state;
    document.getElementById('ma-mode').textContent = data.ma_state.mode;
    
    const total_lots = data.positions.reduce((a,p)=>a+p.lots, 0);
    document.getElementById('lots').textContent = total_lots;
    document.getElementById('lots-sub').textContent = data.positions.length + ' 筆部位';
    
    const tbody = document.getElementById('pos-tbody');
    tbody.innerHTML = data.positions.map(p => `
      <tr>
        <td>${p.date}</td><td>${p.type}</td><td>${p.lots}</td><td>${p.entry_price.toLocaleString()}</td>
        <td class="${p.pnl_twd >= 0 ? 'green' : 'red'}">${(p.pnl_twd >= 0 ? '+' : '') + p.pnl_twd.toLocaleString()}</td>
        <td>${p.note}</td>
      </tr>
    `).join('');
    
    renderChart(data.market.chart_data);
  } catch (e) {
    console.error('Error:', e);
    document.getElementById('price').textContent = '連線失敗';
  }
}

function renderChart(data) {
  const ctx = document.getElementById('chart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.date.slice(5)),
      datasets: [{
        label: '台指期',
        data: data.map(d => d.close),
        borderColor: '#3d9eff',
        backgroundColor: 'rgba(61, 158, 255, 0.1)',
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { ticks: { color: '#4a6070' }, grid: { color: '#1e3048' } },
        x: { ticks: { color: '#4a6070' }, grid: { display: false } }
      }
    }
  });
}

loadDashboard();
setInterval(loadDashboard, 60000);
</script>
</body>
</html>
