<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200萬計畫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #141925;
    --bg3: #1a2030;
    --text: #e8eaed;
    --muted: #6b7280;
    --border: #252d3d;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --red: #ff3d00;
    --green: #00c853;
    --blue: #2196f3;
    --yellow: #ffd32a;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--blue); letter-spacing: 2px; }
  .nav { display: flex; gap: 16px; }
  .nav a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav a.active { color: var(--blue); border-bottom: 1px solid var(--blue); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .value { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .pie-wrapper { height: 300px; position: relative; }
  input { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px; color: var(--text); font-family: var(--mono); font-size: 12px; }
  button { background: rgba(61, 158, 255, 0.7); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 0 2px; }
</style>
</head>
<body>
<header>
  <div class="logo">TXF TRACKER · 200萬計畫</div>
  <nav class="nav">
    <a href="index.html">微台期</a>
    <a href="stocks.html">股票資產</a>
    <a href="assets.html" class="active">200萬計畫</a>
  </nav>
</header>

<main>
  <div class="grid-4">
    <div class="card">
      <div class="label">總資金</div>
      <div class="value blue">2,000,000 元</div>
    </div>
    <div class="card">
      <div class="label">總市值</div>
      <div class="value blue" id="total-value">—</div>
      <div class="sub">台幣估算</div>
    </div>
    <div class="card">
      <div class="label">總損益</div>
      <div class="value" id="total-pnl">—</div>
      <div class="sub" id="total-pct">—</div>
    </div>
    <div class="card">
      <div class="label">現金水位</div>
      <div class="value green" id="cash">—</div>
      <div class="sub" id="cash-pct">—</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="label">資產配置</div>
      <div class="pie-wrapper"><canvas id="pie"></canvas></div>
    </div>
    <div class="card">
      <div class="label">快速新增資產</div>
      <table>
        <tr><th>類別</th><th>金額</th></tr>
        <tr>
          <td><input type="text" id="asset-type" placeholder="台股/ETF/基金/加密"></td>
          <td><input type="number" id="asset-value" placeholder="10000" style="width:100%"></td>
        </tr>
      </table>
      <button onclick="addAsset()">新增</button>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
        <div class="label">資產明細</div>
        <table id="asset-table">
          <tr><th>類別</th><th>金額</th><th>佔比</th><th></th></tr>
        </table>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="label">已實現損益（累積曲線）</div>
    <div style="height:200px;margin-bottom:16px"><canvas id="realized-chart"></canvas></div>
    <table>
      <thead><tr><th>日期</th><th>項目</th><th>數量</th><th>成本價</th><th>結算價</th><th>損益</th></tr></thead>
      <tbody id="realized-tbody"><tr><td colspan="6" style="color:var(--muted)">尚無結算記錄</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="label">總損益明細</div>
    <table id="pnl-detail-table">
      <thead><tr><th>項目</th><th>類別</th><th>數量</th><th>成本價</th><th>市值</th><th>損益</th><th>報酬率</th><th>操作</th></tr></thead>
      <tbody id="pnl-detail-tbody"><tr><td colspan="8" style="color:var(--muted)">載入中...</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const API = 'https://txf-tracker-production.up.railway.app';
let assets = JSON.parse(localStorage.getItem('assets')) || [];
let pieChart = null;

async function calculateAssets() {
  let totalValue = 0;
  let totalCost = 0;
  let txfData = null;
  let stocksData = [];
  
  // 抓台指期資料
  let txfMarginUsed = 0;  // 期貨佔用保證金（算現金水位用）
  try {
    const res = await fetch(API + '/api/dashboard');
    txfData = await res.json();
    const currentPrice = txfData.market.current_price;
    txfData.positions.forEach(p => {
      const pointValue = p.type === 'TXF' ? 50 : 10;
      const margin = p.type === 'TXF' ? 135000 : 30000;
      const cost = p.entry_price * pointValue * p.lots;
      const value = currentPrice * pointValue * p.lots;
      txfMarginUsed += margin * p.lots;
      totalCost += cost;
      totalValue += value;
    });
  } catch (e) { console.error(e); }
  
  // 抓股票/基金資料
  try {
    const res = await fetch(API + '/api/stocks');
    stocksData = await res.json();
    stocksData.forEach(s => {
      const cost = s.cost_price * s.shares;
      const value = s.current_price ? s.current_price * s.shares : cost;
      totalCost += cost;
      totalValue += value;
    });
  } catch (e) { console.error(e); }
  
  // 自訂資產
  assets.forEach(a => {
    totalCost += a.value;
    totalValue += a.value;
  });
  
  // 現金水位：股票/基金用成本扣，期貨用保證金扣
  let cashUsed = txfMarginUsed;
  stocksData.forEach(s => {
    cashUsed += s.cost_price * s.shares;
  });
  assets.forEach(a => cashUsed += a.value);
  const cash = 2000000 - cashUsed;
  const pnl = totalValue - totalCost;
  const pnlPct = totalCost > 0 ? ((pnl / totalCost) * 100).toFixed(2) : 0;
  
  document.getElementById('total-value').textContent = Math.round(totalValue).toLocaleString() + ' 元';
  const pnlEl = document.getElementById('total-pnl');
  pnlEl.className = 'value ' + (pnl >= 0 ? 'red' : 'green');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + Math.round(pnl).toLocaleString() + ' 元';
  document.getElementById('total-pct').textContent = (pnl >= 0 ? '+' : '') + pnlPct + '%';
  
  document.getElementById('cash').textContent = Math.round(cash).toLocaleString() + ' 元';
  document.getElementById('cash-pct').textContent = ((cash / 2000000) * 100).toFixed(2) + '%';
  
  renderPie(totalValue, cash);
  renderAssetTable();
  renderPnlDetail();
}

async function renderPnlDetail() {
  const tbody = document.getElementById('pnl-detail-tbody');
  let html = '';
  
  // 台指期明細
  try {
    const res = await fetch(API + '/api/dashboard');
    const data = await res.json();
    const positions = data.positions || [];
    
    const currentPrice = data.market.current_price;
    positions.forEach(p => {
      const pointValue = p.type === 'TXF' ? 50 : 10;
      const cost = p.entry_price * pointValue * p.lots;
      const value = currentPrice * pointValue * p.lots;
      const pnlPct = ((p.pnl_twd / cost) * 100).toFixed(2);
      const color = p.pnl_twd >= 0 ? 'red' : 'green';
      html += `
        <tr>
          <td>${p.type} ${p.note || ''}</td>
          <td>台指期</td>
          <td>${p.lots} 口</td>
          <td>${p.entry_price.toLocaleString()}</td>
          <td>${value.toLocaleString()}</td>
          <td class="${color}">${(p.pnl_twd >= 0 ? '+' : '') + p.pnl_twd.toLocaleString()}</td>
          <td class="${color}">${(p.pnl_twd >= 0 ? '+' : '') + pnlPct}%</td>
          <td>
            <button onclick="editPosition(${p.id}, ${p.lots}, ${p.entry_price})">編輯</button>
            <button onclick="closePosition(${p.id}, ${p.lots})" style="background:rgba(0, 229, 160, 0.7)">結算</button>
          </td>
        </tr>
      `;
    });
  } catch (e) {
    console.error(e);
  }
  
  // 股票/基金明細
  try {
    const res = await fetch(API + '/api/stocks');
    const stocks = await res.json();
    
    stocks.forEach(s => {
      const cost = s.cost_price * s.shares;
      const value = (s.current_price || 0) * s.shares;
      const pnl = s.pnl_twd || 0;
      const pnlPct = s.pnl_pct || 0;
      const color = pnl >= 0 ? 'red' : 'green';
      const type = s.symbol.startsWith('FUND:') ? '基金' : '股票/ETF';
      html += `
        <tr>
          <td>${s.symbol.replace('FUND:', '')} ${s.name || ''}</td>
          <td>${type}</td>
          <td>${s.shares}</td>
          <td>${s.cost_price.toLocaleString()}</td>
          <td>${value ? Math.round(value).toLocaleString() : '—'}</td>
          <td class="${color}">${pnl ? (pnl >= 0 ? '+' : '') + pnl.toLocaleString() : '—'}</td>
          <td class="${color}">${pnlPct ? (pnlPct >= 0 ? '+' : '') + pnlPct + '%' : '—'}</td>
          <td>
            <button onclick="editStock(${s.id}, ${s.shares}, ${s.cost_price})">編輯</button>
            <button onclick="sellStock(${s.id}, ${s.shares}, '${s.symbol}')" style="background:rgba(0, 229, 160, 0.7)">結算</button>
          </td>
        </tr>
      `;
    });
  } catch (e) {
    console.error(e);
  }
  
  // 自訂資產
  assets.forEach((a, i) => {
    html += `
      <tr>
        <td>${a.type}</td>
        <td>自訂</td>
        <td>—</td>
        <td>—</td>
        <td>${a.value.toLocaleString()}</td>
        <td>—</td>
        <td>—</td>
        <td><button onclick="deleteAsset(${i})" style="background:rgba(255, 71, 87, 0.7)">刪除</button></td>
      </tr>
    `;
  });
  
  if (!html) html = '<tr><td colspan="8" style="color:var(--muted)">尚無持倉</td></tr>';
  tbody.innerHTML = html;
}

async function renderPie(marketValue, cash) {
  const ctx = document.getElementById('pie').getContext('2d');
  if (pieChart) pieChart.destroy();
  
  const labels = [];
  const data = [];
  const colors = [];
  const colorPalette = ['#3d9eff', '#00e5a0', '#ffd32a', '#ff9f43', '#ff6b9d', '#a55eea', '#26d0ce', '#fd79a8', '#fdcb6e', '#6c5ce7'];
  let colorIdx = 0;
  
  // 台指期每筆部位
  try {
    const res = await fetch(API + '/api/dashboard');
    const txfData = await res.json();
    const currentPrice = txfData.market.current_price;
    txfData.positions.forEach(p => {
      const pointValue = p.type === 'TXF' ? 50 : 10;
      const value = currentPrice * pointValue * p.lots;
      labels.push(`${p.type} ${p.lots}口`);
      data.push(value);
      colors.push(colorPalette[colorIdx++ % colorPalette.length]);
    });
  } catch(e) { console.error(e); }
  
  // 股票/基金每筆
  try {
    const res = await fetch(API + '/api/stocks');
    const stocks = await res.json();
    stocks.forEach(s => {
      const value = (s.current_price || s.cost_price) * s.shares;
      labels.push(s.symbol.replace('FUND:', ''));
      data.push(value);
      colors.push(colorPalette[colorIdx++ % colorPalette.length]);
    });
  } catch(e) { console.error(e); }
  
  // 自訂資產
  assets.forEach(a => {
    labels.push(a.type);
    data.push(a.value);
    colors.push(colorPalette[colorIdx++ % colorPalette.length]);
  });
  
  // 現金
  if (cash > 0) {
    labels.push('現金');
    data.push(cash);
    colors.push('#4a6070');
  }
  
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderColor: '#112236',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { 
          position: 'right',
          labels: { 
            color: '#c8d8e8', 
            font: { family: 'DM Sans', size: 11 },
            padding: 8
          } 
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const pct = ((ctx.raw / total) * 100).toFixed(1);
              return `${ctx.label}: ${Math.round(ctx.raw).toLocaleString()} (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function renderAssetTable() {
  const table = document.getElementById('asset-table');
  const totalValue = 2000000 - assets.reduce((s,a)=>s+a.value,0);
  
  table.innerHTML = '<tr><th>類別</th><th>金額</th><th>佔比</th><th></th></tr>' +
    assets.map((a,i) => `<tr>
      <td>${a.type}</td>
      <td>${a.value.toLocaleString()}</td>
      <td>${((a.value/2000000)*100).toFixed(1)}%</td>
      <td><button onclick="deleteAsset(${i})" style="background:var(--red);padding:4px 8px;font-size:11px">刪</button></td>
    </tr>`).join('');
}

function addAsset() {
  const type = document.getElementById('asset-type').value;
  const value = parseInt(document.getElementById('asset-value').value);
  if (!type || !value) return alert('請填寫類別和金額');
  
  assets.push({type, value});
  localStorage.setItem('assets', JSON.stringify(assets));
  document.getElementById('asset-type').value = '';
  document.getElementById('asset-value').value = '';
  calculateAssets();
}

async function loadRealized() {
  try {
    const res = await fetch(API + '/api/realized-pnl');
    const records = await res.json();
    const tbody = document.getElementById('realized-tbody');
    
    if (records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">尚無結算記錄</td></tr>';
      return;
    }
    
    // 表格（台灣紅漲綠跌）
    tbody.innerHTML = records.map(r => {
      const color = r.pnl_twd >= 0 ? 'red' : 'green';
      const sign = r.pnl_twd >= 0 ? '+' : '';
      return `
        <tr>
          <td>${r.date}</td>
          <td>${r.note || '—'}</td>
          <td>${r.lots}</td>
          <td>${r.entry_price.toLocaleString()}</td>
          <td>${r.exit_price.toLocaleString()}</td>
          <td class="${color}">${sign}${r.pnl_twd.toLocaleString()}</td>
        </tr>
      `;
    }).join('');
    
    // 累積曲線圖
    const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
    let cumulative = 0;
    const labels = [];
    const dataPoints = [];
    sorted.forEach(r => {
      cumulative += r.pnl_twd;
      labels.push(r.date);
      dataPoints.push(cumulative);
    });
    
    const ctx = document.getElementById('realized-chart').getContext('2d');
    if (window.realizedChart) window.realizedChart.destroy();
    window.realizedChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '累積已實現損益',
          data: dataPoints,
          borderColor: '#d4af37',
          backgroundColor: 'rgba(212, 175, 55, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c8d8e8' } } },
        scales: {
          x: { 
            ticks: { autoSkip: true, maxRotation: 0, color: '#c8d8e8' },
            grid: { color: '#2c4258' }
          },
          y: { 
            ticks: { color: '#c8d8e8' },
            grid: { color: '#2c4258' }
          }
        }
      }
    });
  } catch (e) {
    console.error('Realized error:', e);
  }
}

async function editPosition(id, currentLots, currentPrice) {
  const dialog = document.getElementById('edit-dialog');
  const confirmBtn = document.getElementById('dialog-confirm');
  document.getElementById('dialog-title').textContent = '編輯部位';
  document.getElementById('dialog-amount').value = currentLots;
  document.getElementById('dialog-price').value = currentPrice;
  dialog.showModal();
  
  confirmBtn.onclick = async () => {
    const amountVal = document.getElementById('dialog-amount').value;
    const priceVal = document.getElementById('dialog-price').value;
    if (amountVal === '' || priceVal === '') return;
    
    const newLots = parseFloat(amountVal);
    const newPrice = parseFloat(priceVal);
    
    confirmBtn.disabled = true;
    confirmBtn.textContent = '更新中...';
    
    try {
      const res = await fetch(API + '/api/positions/' + id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({lots: newLots, entry_price: newPrice})
      });
      if (!res.ok) throw new Error('更新失敗');
      dialog.close();
      calculateAssets();
      loadRealized();
    } catch (e) {
      alert('更新失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認更新';
    }
  };
}

async function closePosition(id, maxLots) {
  const lots = prompt(`輸入結算口數 (最多 ${maxLots}):`, maxLots);
  if (!lots) return;
  const exitPrice = prompt('輸入結算價格:');
  if (!exitPrice) return;
  const note = prompt('備註 (選填):', '');
  
  try {
    const res = await fetch(API + '/api/positions/' + id + '/close', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lots: parseFloat(lots), exit_price: parseFloat(exitPrice), note: note || ''})
    });
    const data = await res.json();
    alert(data.message);
    calculateAssets();
    loadRealized();
  } catch (e) {
    alert('結算失敗');
  }
}

async function editStock(id, currentShares, currentPrice) {
  const dialog = document.getElementById('edit-dialog');
  const confirmBtn = document.getElementById('dialog-confirm');
  document.getElementById('dialog-title').textContent = '編輯持倉';
  document.getElementById('dialog-amount').value = currentShares;
  document.getElementById('dialog-price').value = currentPrice;
  dialog.showModal();
  
  confirmBtn.onclick = async () => {
    const amountVal = document.getElementById('dialog-amount').value;
    const priceVal = document.getElementById('dialog-price').value;
    if (amountVal === '' || priceVal === '') return;
    
    const newShares = parseFloat(amountVal);
    const newPrice = parseFloat(priceVal);
    
    confirmBtn.disabled = true;
    confirmBtn.textContent = '更新中...';
    
    try {
      const res = await fetch(API + '/api/stocks/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({shares: newShares, cost_price: newPrice})
      });
      if (!res.ok) throw new Error('更新失敗');
      dialog.close();
      calculateAssets();
      loadRealized();
    } catch (e) {
      alert('更新失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認更新';
    }
  };
}

// 通用刪除函數
async function deleteItem(id, type, name) {
  const dialog = document.getElementById('delete-dialog');
  const confirmBtn = document.getElementById('delete-confirm-btn');
  document.getElementById('delete-msg').textContent = `確定刪除「${name}」？此操作無法還原。`;
  dialog.showModal();
  
  confirmBtn.onclick = async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = '刪除中...';
    
    try {
      const res = await fetch(`${API}/api/${type}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('刪除失敗');
      dialog.close();
      calculateAssets();
      loadRealized();
    } catch (e) {
      alert('刪除失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認刪除';
    }
  };
}

async function sellStock(id, maxShares, symbol) {
  const shares = prompt(`輸入結算數量 (最多 ${maxShares}):`, maxShares);
  if (!shares) return;
  const exitPrice = prompt('輸入結算價格:');
  if (!exitPrice) return;
  const note = prompt('備註 (選填):', '');
  
  try {
    const res = await fetch(API + '/api/stocks/' + id + '/sell', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({shares: parseFloat(shares), exit_price: parseFloat(exitPrice), note: note || ''})
    });
    const data = await res.json();
    alert(data.message);
    calculateAssets();
    loadRealized();
  } catch (e) {
    alert('結算失敗');
  }
}

function deleteAsset(i) {
  assets.splice(i, 1);
  localStorage.setItem('assets', JSON.stringify(assets));
  calculateAssets();
}

calculateAssets();
</script>
