<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200萬計畫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #141925;
    --bg3: #1a2030;
    --text: #e8eaed;
    --muted: #6b7280;
    --border: #252d3d;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --red: #ff3d00;
    --green: #00c853;
    --blue: #2196f3;
    --yellow: #ffd32a;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--blue); letter-spacing: 2px; }
  .nav { display: flex; gap: 16px; }
  .nav a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav a.active { color: var(--blue); border-bottom: 1px solid var(--blue); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .value { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .pie-wrapper { height: 300px; position: relative; }
  input { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px; color: var(--text); font-family: var(--mono); font-size: 12px; }
  button { background: rgba(61, 158, 255, 0.7); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 0 2px; }

@media (max-width: 768px) {
  body { padding: 0; font-size: 14px; }
  header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  .nav { gap: 12px; }
  main { padding: 16px; }
  
  .grid-2, .grid-3, .grid-4, .grid-5 {
    grid-template-columns: 1fr !important;
    gap: 12px;
  }
  .card { padding: 14px; margin-bottom: 12px; }
  .value { font-size: 1.4rem !important; }
  
  button {
    min-height: 38px;
    padding: 8px 12px;
    font-size: 13px;
  }
  
  input, select {
    font-size: 16px !important;
    padding: 10px;
  }
  
  h1 { font-size: 1.4rem !important; }
  h2 { font-size: 1.1rem !important; }
  
  canvas { max-height: 220px; }
  
  /* 表格轉卡片 */
  table.responsive thead { display: none; }
  table.responsive,
  table.responsive tbody,
  table.responsive tr,
  table.responsive td {
    display: block;
    width: 100%;
  }
  table.responsive tr {
    background: var(--bg3);
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  table.responsive td {
    padding: 6px 0;
    border: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  table.responsive td::before {
    content: attr(data-label);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table.responsive td:last-child { 
    flex-wrap: wrap; 
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
}

</style>
</head>
<body>
<header>
  <div class="logo">TXF TRACKER · 200萬計畫</div>
  <nav class="nav">
    <a href="index.html">微台期</a>
    <a href="stocks.html">股票資產</a>
    <a href="assets.html" class="active">200萬計畫</a>
<a href="strategy.html">策略</a>
  </nav>
</header>

<main>
  <div class="grid-4">
    <div class="card">
      <div class="label">總資金</div>
      <div class="value blue">2,000,000 元</div>
    </div>
    <div class="card">
      <div class="label">總市值</div>
      <div class="value blue" id="total-value">—</div>
      <div class="sub">台幣估算</div>
    </div>
    <div class="card">
      <div class="label">總損益</div>
      <div class="value" id="total-pnl">—</div>
      <div class="sub" id="total-pct">—</div>
    </div>
    <div class="card">
      <div class="label">現金水位</div>
      <div class="value green" id="cash">—</div>
      <div class="sub" id="cash-pct">—</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="label">資產配置</div>
      <div class="pie-wrapper"><canvas id="pie"></canvas></div>
    </div>
    <div class="card">
      <div class="label">快速新增資產</div>
      <table class="responsive">
        <tr><th>項目</th><th>類別</th><th>數量</th><th>成本價</th><th>市值</th></tr>
        <tr>
          <td><input type="text" id="asset-name" placeholder="名稱"></td>
          <td><input type="text" id="asset-type" placeholder="台股/ETF/基金/加密"></td>
          <td><input type="number" id="asset-shares" placeholder="0" step="any"></td>
          <td><input type="number" id="asset-cost" placeholder="0" step="any"></td>
          <td><input type="number" id="asset-value" placeholder="0" style="width:100%"></td>
        </tr>
      </table>
      <button onclick="addAsset()">新增</button>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
        <div class="label">資產明細</div>
        <table id="asset-table" class="responsive">
          <tr><th>項目</th><th>類別</th><th>數量</th><th>成本</th><th>市值</th><th>佔比</th><th></th></tr>
        </table>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="label">🔔 通知中心</div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div id="notify-status" style="font-size:14px;color:var(--muted)">載入中...</div>
      <button onclick="testNotification()" style="background:var(--blue);font-size:13px">📤 測試通知</button>
      <button onclick="clearNotifications()" style="background:transparent;color:var(--muted);font-size:13px;border:1px solid var(--border)">清空歷史</button>
    </div>
    <div style="max-height:200px;overflow-y:auto;border-top:1px solid var(--border);padding-top:10px">
      <div id="notify-list" style="font-size:13px"></div>
    </div>
  </div>

  <div class="card">
    <div class="label">已實現損益（累積曲線）</div>
    <div style="height:200px;margin-bottom:16px"><canvas id="realized-chart"></canvas></div>
    <table class="responsive">
      <thead><tr><th>日期</th><th>項目</th><th>數量</th><th>成本價</th><th>結算價</th><th>損益</th><th>操作</th></tr></thead>
      <tbody id="realized-tbody"><tr><td colspan="7" style="color:var(--muted)">尚無結算記錄</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="label">總損益明細</div>
    <table id="pnl-detail-table" class="responsive">
      <thead><tr><th>項目</th><th>類別</th><th>數量</th><th>成本價</th><th>市值</th><th>損益</th><th>報酬率</th><th>操作</th></tr></thead>
      <tbody id="pnl-detail-tbody"><tr><td colspan="8" style="color:var(--muted)">載入中...</td></tr></tbody>
    </table>
  </div>
</main>

<script type="module" src="firebase-init.js"></script>
<script type="module" src="positions.js"></script>
<script type="module" src="stocks-data.js"></script>
<script>
const TXF_MULT = { TXF: 200, MXF: 50, TMF: 10, '大台': 200, '小台': 50, '微台': 10 };
const TXF_POINT = { TXF: 50, MXF: 10, TMF: 5 };  // 每點價值(現金水位用,保留原邏輯)
let assets = [];

async function loadCustomAssets() {
  try {
    assets = await window.fetchCustomAssets();
    calculateAssets();
  } catch (e) { console.error('load custom assets failed', e); }
}
let pieChart = null;

async function loadNotifications() {
  // 系統狀態
  try {
    const status = { enabled: true };  // LINE 推播
    const statusEl = document.getElementById('notify-status');
    if (status.telegram_configured && status.enabled) {
      statusEl.innerHTML = '✅ 通知系統運作中｜冷卻 ' + status.cooldown_minutes + ' 分鐘';
      statusEl.style.color = 'var(--green)';
    } else {
      statusEl.innerHTML = '⚠️ 通知未啟用';
      statusEl.style.color = 'var(--red)';
    }
  } catch (e) {
    document.getElementById('notify-status').textContent = '無法連線';
  }
  
  // 通知歷史
  try {
    const res = { json: async () => [] };
    const records = await res.json();
    const listEl = document.getElementById('notify-list');
    if (records.length === 0) {
      listEl.innerHTML = '<div style="color:var(--muted);padding:8px">尚無通知記錄</div>';
      return;
    }
    listEl.innerHTML = records.map(r => {
      const time = new Date(r.sent_at).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      const msg = (r.message || '').replace(/<[^>]*>/g, '').substring(0, 80);
      return `
        <div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="color:var(--muted);font-size:11px">${time}</div>
          <div style="margin-top:2px">${msg}${msg.length >= 80 ? '...' : ''}</div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error('載入通知失敗', e);
  }
}

async function testNotification() {
  alert('測試通知已改用 LINE 推播,請見 LINE 官方帳號'); return;
  const res = { ok: false };
  const data = await res.json();
  alert(data.message);
}

async function clearNotifications() {
  if (!confirm('確定清空所有通知歷史？')) return;
  return;  // 通知歷史已改 LINE
  loadNotifications();
}

async function calculateAssets() {
  let totalValue = 0;
  let totalCost = 0;
  let txfData = null;
  let stocksData = [];
  
  // 抓台指期資料(Firestore 部位 + market_data.json)
  let txfMarginUsed = 0;
  let currentPrice = 0;
  try {
    const market = await window.fetchMarketData();
    if (market && market.market) {
      currentPrice = market.market.current_price;
      const positions = await window.fetchPositions();
      txfData = { market: market.market, positions };
      positions.forEach(p => {
        const pointValue = TXF_POINT[p.type] || 10;
        const margin = (p.type === 'TXF' || p.type === '大台') ? 135000 : 30000;
        const cost = p.entry_price * pointValue * p.lots;
        const value = currentPrice * pointValue * p.lots;
        txfMarginUsed += margin * p.lots;
        totalCost += cost;
        totalValue += value;
      });
    }
  } catch (e) { console.error(e); }

  // 抓股票/基金資料(Firestore + stock_prices.json)
  try {
    const prices = await window.fetchStockPrices();
    stocksData = await window.fetchStocks();
    stocksData.forEach(s => {
      const isFund = s.is_fund || (s.symbol || '').startsWith('FUND:');
      const curP = isFund ? (s.current_price || 0) : ((prices[s.symbol] || {}).price || s.current_price || 0);
      const cost = s.cost_price * s.shares;
      const value = curP ? curP * s.shares : cost;
      s._current = curP;  // 存起來給後續用
      totalCost += cost;
      totalValue += value;
    });
  } catch (e) { console.error(e); }
  
  // 自訂資產
  assets.forEach(a => {
    totalCost += a.value;
    totalValue += a.value;
  });
  
  // 現金水位：股票/基金用成本扣，期貨用保證金扣
  let cashUsed = txfMarginUsed;
  stocksData.forEach(s => {
    cashUsed += s.cost_price * s.shares;
  });
  assets.forEach(a => cashUsed += a.value);
  const cash = 2000000 - cashUsed;
  const pnl = totalValue - totalCost;
  const pnlPct = totalCost > 0 ? ((pnl / totalCost) * 100).toFixed(2) : 0;
  
  document.getElementById('total-value').textContent = Math.round(totalValue).toLocaleString() + ' 元';
  const pnlEl = document.getElementById('total-pnl');
  pnlEl.className = 'value ' + (pnl >= 0 ? 'red' : 'green');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + Math.round(pnl).toLocaleString() + ' 元';
  document.getElementById('total-pct').textContent = (pnl >= 0 ? '+' : '') + pnlPct + '%';
  
  document.getElementById('cash').textContent = Math.round(cash).toLocaleString() + ' 元';
  document.getElementById('cash-pct').textContent = ((cash / 2000000) * 100).toFixed(2) + '%';
  
  renderPie(totalValue, cash);
  renderAssetTable();
  renderPnlDetail();
}

async function renderPnlDetail() {
  const tbody = document.getElementById('pnl-detail-tbody');
  let html = '';
  
  // 台指期明細
  try {
    const res = { json: async () => { const m = await window.fetchMarketData(); const positions = await window.fetchPositions(); return { market: m ? m.market : {}, positions, total_pnl_twd: 0 }; } };
    const data = await res.json();
    const positions = data.positions || [];
    
    const currentPrice = data.market.current_price || 0;
    positions.forEach(p => {
      const pointValue = TXF_POINT[p.type] || 10;
      const cost = p.entry_price * pointValue * p.lots;
      const value = currentPrice * pointValue * p.lots;
      const pnl_twd = Math.round((currentPrice - p.entry_price) * pointValue * p.lots);
      const pnlPct = cost ? ((pnl_twd / cost) * 100).toFixed(2) : '0';
      const color = pnl_twd >= 0 ? 'red' : 'green';
      html += `
        <tr>
          <td data-label="項目">${p.type} ${p.note || ''}</td>
          <td data-label="類別">台指期</td>
          <td data-label="數量">${p.lots} 口</td>
          <td data-label="成本價">${p.entry_price.toLocaleString()}</td>
          <td data-label="市值">${value.toLocaleString()}</td>
          <td data-label="損益" class="${color}">${(pnl_twd >= 0 ? '+' : '') + pnl_twd.toLocaleString()}</td>
          <td data-label="報酬率" class="${color}">${(pnl_twd >= 0 ? '+' : '') + pnlPct}%</td>
          <td data-label="操作"><button onclick="editPosition(${p.id}, ${p.lots}, ${p.entry_price})">編輯</button>
            <button onclick="closePosition(${p.id}, ${p.lots})" style="background:rgba(0, 229, 160, 0.7)">結算</button>
          </td>
        </tr>
      `;
    });
  } catch (e) {
    console.error(e);
  }
  
  // 股票/基金明細
  try {
    const stocks = await window.fetchStocks();
    
    stocks.forEach(s => {
      const cost = s.cost_price * s.shares;
      const value = (s.current_price || 0) * s.shares;
      const pnl = s.pnl_twd || 0;
      const pnlPct = s.pnl_pct || 0;
      const color = pnl >= 0 ? 'red' : 'green';
      const type = s.symbol.startsWith('FUND:') ? '基金' : '股票/ETF';
      html += `
        <tr>
          <td data-label="項目">${s.symbol.replace('FUND:', '')} ${s.name || ''}</td>
          <td data-label="類別">${type}</td>
          <td data-label="數量">${s.shares}</td>
          <td data-label="成本價">${s.cost_price.toLocaleString()}</td>
          <td data-label="市值">${value ? Math.round(value).toLocaleString() : '—'}</td>
          <td data-label="損益" class="${color}">${pnl ? (pnl >= 0 ? '+' : '') + pnl.toLocaleString() : '—'}</td>
          <td data-label="報酬率" class="${color}">${pnlPct ? (pnlPct >= 0 ? '+' : '') + pnlPct + '%' : '—'}</td>
          <td data-label="操作"><button onclick="editStock(${s.id}, ${s.shares}, ${s.cost_price})">編輯</button>
            <button onclick="sellStock(${s.id}, ${s.shares}, '${s.symbol}')" style="background:rgba(0, 229, 160, 0.7)">結算</button>
          </td>
        </tr>
      `;
    });
  } catch (e) {
    console.error(e);
  }
  
  // 自訂資產
  assets.forEach((a, i) => {
    const pnl = a.pnl || 0;
    const pnlPct = a.pnlPct || 0;
    const color = pnl >= 0 ? 'red' : 'green';
    const hasFullData = a.shares && a.cost;
    html += `
      <tr>
        <td data-label="項目">${a.name || a.type}</td>
        <td data-label="類別">${a.type}</td>
        <td data-label="數量">${hasFullData ? a.shares : '—'}</td>
        <td data-label="成本價">${hasFullData ? a.cost.toLocaleString() : '—'}</td>
        <td data-label="市值">${a.value.toLocaleString()}</td>
        <td data-label="損益" class="${hasFullData ? color : ''}">${hasFullData ? (pnl >= 0 ? '+' : '') + pnl.toLocaleString() : '—'}</td>
        <td data-label="報酬率" class="${hasFullData ? color : ''}">${hasFullData ? (pnl >= 0 ? '+' : '') + pnlPct + '%' : '—'}</td>
        <td data-label="操作"><button onclick="editAsset(${i})">編輯</button>
            <button onclick="settleAsset(${i})" style="background:rgba(0, 229, 160, 0.7)">結算</button>
            <button onclick="deleteAsset(${i})" style="background:rgba(255, 71, 87, 0.7)">刪除</button></td>
      </tr>
    `;
  });
  
  if (!html) html = '<tr><td colspan="8" style="color:var(--muted)">尚無持倉</td></tr>';
  tbody.innerHTML = html;
}

async function renderPie(marketValue, cash) {
  const ctx = document.getElementById('pie').getContext('2d');
  if (pieChart) pieChart.destroy();
  
  const labels = [];
  const data = [];
  const colors = [];
  const colorPalette = ['#3d9eff', '#00e5a0', '#ffd32a', '#ff9f43', '#ff6b9d', '#a55eea', '#26d0ce', '#fd79a8', '#fdcb6e', '#6c5ce7'];
  let colorIdx = 0;
  
  // 台指期每筆部位（用保證金算大小，現金+保證金+股票成本=200萬）
  try {
    const res = { json: async () => { const m = await window.fetchMarketData(); const positions = await window.fetchPositions(); return { market: m ? m.market : {}, positions }; } };
    const txfData = await res.json();
    txfData.positions.forEach(p => {
      const margin = p.type === 'TXF' ? 540000 : (p.type === 'MXF' ? 135000 : 30000);
      const value = margin * p.lots;  // 用保證金佔額算
      labels.push(`${p.type} ${p.lots}口`);
      data.push(value);
      colors.push(colorPalette[colorIdx++ % colorPalette.length]);
    });
  } catch(e) { console.error(e); }
  
  // 股票/基金每筆（用成本算）
  try {
    const res = { json: async () => await window.fetchStocks() };
    const stocks = await res.json();
    stocks.forEach(s => {
      const value = s.cost_price * s.shares;
      labels.push(s.symbol.replace('FUND:', ''));
      data.push(value);
      colors.push(colorPalette[colorIdx++ % colorPalette.length]);
    });
  } catch(e) { console.error(e); }
  
  // 自訂資產
  assets.forEach(a => {
    labels.push(a.type);
    data.push(a.value);
    colors.push(colorPalette[colorIdx++ % colorPalette.length]);
  });
  
  // 現金
  if (cash > 0) {
    labels.push('現金');
    data.push(cash);
    colors.push('#4a6070');
  }
  
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderColor: '#112236',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { 
          position: 'right',
          labels: { 
            color: '#c8d8e8', 
            font: { family: 'DM Sans', size: 11 },
            padding: 8
          } 
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const pct = ((ctx.raw / 2000000) * 100).toFixed(2);
              return `${ctx.label}: ${Math.round(ctx.raw).toLocaleString()} (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function renderAssetTable() {
  const table = document.getElementById('asset-table');
  const totalAssets = assets.reduce((s,a)=>s+a.value,0);

  table.innerHTML = '<tr><th>項目</th><th>類別</th><th>數量</th><th>成本</th><th>市值</th><th>佔比</th><th></th></tr>' +
    assets.map((a,i) => {
      const hasFullData = a.shares && a.cost;
      return `<tr>
        <td data-label="項目">${a.name || a.type}</td>
        <td data-label="類別">${a.type}</td>
        <td data-label="數量">${hasFullData ? a.shares : '—'}</td>
        <td data-label="成本">${hasFullData ? a.cost.toLocaleString() : '—'}</td>

  try {
    await window.updateCustomAssetFS(a.id, {name, type, shares, cost, value});

async function editRealized(id) {
  try {
    const res = { json: async () => await window.fetchRealized() };
    const list = await res.json();
    const r = list.find(x => x.id === id);
    if (!r) return alert('找不到記錄');
    const dialog = document.getElementById('realized-edit-dialog');
    document.getElementById('rd-date').value = r.date;
    document.getElementById('rd-note').value = r.note || '';
    document.getElementById('rd-lots').value = r.lots;
    document.getElementById('rd-entry').value = r.entry_price;
    document.getElementById('rd-exit').value = r.exit_price;
    document.getElementById('rd-pnl').value = r.pnl_twd;
    dialog.showModal();
    document.getElementById('rd-confirm').onclick = async () => {
      const payload = {
        date: document.getElementById('rd-date').value,
        note: document.getElementById('rd-note').value,
        lots: parseFloat(document.getElementById('rd-lots').value),
        entry_price: parseFloat(document.getElementById('rd-entry').value),
        exit_price: parseFloat(document.getElementById('rd-exit').value),
        pnl_twd: parseFloat(document.getElementById('rd-pnl').value)
      };

      dialog.close();
      loadRealized();
    };
  } catch (e) { alert('編輯失敗'); }
}

async function deleteRealized(id) {
  if (!confirm('確定刪除這筆已實現損益？')) return;
  try {
    await window.deleteRealizedFS(id);
    loadRealized();
  } catch (e) { alert('刪除失敗'); }
}

async function loadRealized() {
  try {
    const records = await window.fetchRealized();
    const tbody = document.getElementById('realized-tbody');
    
    if (records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="color:var(--muted)">尚無結算記錄</td></tr>';
      return;
    }
    
    // 表格（台灣紅漲綠跌）
    tbody.innerHTML = records.map(r => {
      const color = r.pnl_twd >= 0 ? 'red' : 'green';
      const sign = r.pnl_twd >= 0 ? '+' : '';
      return `
        <tr>
          <td data-label="日期">${r.date}</td>
          <td data-label="項目">${r.note || '—'}</td>
          <td data-label="數量">${r.lots}</td>
          <td data-label="成本">${r.entry_price.toLocaleString()}</td>
          <td data-label="結算">${r.exit_price.toLocaleString()}</td>
          <td data-label="淨損益" class="${color}">${sign}${r.pnl_twd.toLocaleString()}</td>
          <td data-label="操作">
            <button onclick="editRealized(${r.id})" style="background:var(--blue);font-size:11px;margin-right:4px">✏️ 編輯</button>
            <button onclick="deleteRealized(${r.id})" style="background:rgba(255, 71, 87, 0.7);font-size:11px">刪除</button>
          </td>
        </tr>
      `;
    }).join('');
    
    // 累積曲線圖
    const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
    let cumulative = 0;
    const labels = [];
    const dataPoints = [];
    sorted.forEach(r => {
      cumulative += r.pnl_twd;
      labels.push(r.date);
      dataPoints.push(cumulative);
    });
    
    const ctx = document.getElementById('realized-chart').getContext('2d');
    if (window.realizedChart) window.realizedChart.destroy();
    window.realizedChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '累積已實現損益',
          data: dataPoints,
          borderColor: '#d4af37',
          backgroundColor: 'rgba(212, 175, 55, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c8d8e8' } } },
        scales: {
          x: { 
            ticks: { autoSkip: true, maxRotation: 0, color: '#c8d8e8' },
            grid: { color: '#2c4258' }
          },
          y: { 
            ticks: { color: '#c8d8e8' },
            grid: { color: '#2c4258' }
          }
        }
      }
    });
  } catch (e) {
    console.error('Realized error:', e);
  }
}

async function closePosition(id, maxLots) {
  const lots = prompt(`輸入結算口數 (最多 ${maxLots}):`, maxLots);
  if (!lots) return;
  const exitPrice = prompt('輸入結算價格:');
  if (!exitPrice) return;
  const note = prompt('備註 (選填):', '');
  
  try {
    const mult = TXF_MULT[window._closingType] || 10;
    await window.addRealizedFS({
      date: new Date().toISOString().slice(0,10),
      lots: parseFloat(lots),
      entry_price: window._closingEntry || 0,
      exit_price: parseFloat(exitPrice),
      pnl_twd: Math.round((parseFloat(exitPrice) - (window._closingEntry||0)) * mult * parseFloat(lots)),
      note: '台指期平倉 ' + (note || '')
    });
    await window.deletePositionFS(id);
    alert('已平倉並記錄損益');
    calculateAssets();
    loadRealized();
  } catch (e) {
    alert('結算失敗');
  }
}

// 通用刪除函數
async function deleteItem(id, type, name) {
  const dialog = document.getElementById('delete-dialog');
  const confirmBtn = document.getElementById('delete-confirm-btn');
  document.getElementById('delete-msg').textContent = `確定刪除「${name}」？此操作無法還原。`;
  dialog.showModal();
  
  confirmBtn.onclick = async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = '刪除中...';
    
    try {
      const res = await fetch(`${API}/api/${type}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('刪除失敗');
      dialog.close();
      calculateAssets();
      loadRealized();
    } catch (e) {
      alert('刪除失敗：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認刪除';
    }
  };
}

async function sellStock(id, maxShares, symbol) {
  const shares = prompt(`輸入結算數量 (最多 ${maxShares}):`, maxShares);
  if (!shares) return;
  const exitPrice = prompt('輸入結算價格:');
  if (!exitPrice) return;
  const note = prompt('備註 (選填):', '');
  
  try {
    await window.addRealizedFS({
      date: new Date().toISOString().slice(0,10),
      lots: parseFloat(shares),
      entry_price: window._sellingCost || 0,
      exit_price: parseFloat(exitPrice),
      pnl_twd: Math.round((parseFloat(exitPrice) - (window._sellingCost||0)) * parseFloat(shares)),
      note: '股票賣出 ' + (note || '')
    });
    await window.deleteStockFS(id);
    alert('已賣出並記錄損益');

  } catch (e) {

async function settleAsset(i) {
  const a = assets[i];
  const exitValue = parseInt(prompt(`結算「${a.name || a.type}」\n結算金額？`, a.value));
  if (!exitValue) return;
  const cost = (a.shares && a.cost) ? a.shares * a.cost : a.value;
  const pnl = exitValue - cost;
  const note = prompt('備註（選填）', '結算') || '結算';

  try {
    await window.addRealizedFS({
      date: new Date().toISOString().slice(0,10),
      lots: a.shares || 1,
      entry_price: a.cost || a.value,
      exit_price: a.shares ? (exitValue / a.shares) : exitValue,
      pnl_twd: pnl,
      note: `${a.name || a.type} ${note}`
    });
    alert(`已結算\n損益：${pnl >= 0 ? '+' : ''}${pnl.toLocaleString()} 元`);
    await window.deleteCustomAssetFS(a.id);
    await loadCustomAssets();
    loadRealized();
  } catch (e) {
    if (confirm('寫入失敗，是否仍刪除？')) {
      await window.deleteCustomAssetFS(a.id);
      await loadCustomAssets();
    }
  }
}

async function deleteAsset(i) {
  if (!confirm('確定刪除？')) return;
  const a = assets[i];
  try {
    await window.deleteCustomAssetFS(a.id);
    await loadCustomAssets();
  } catch (e) { alert('刪除失敗'); }
}

(function waitInit(){
  if (window.fetchCustomAssets && window.fetchRealized && window.fetchStocks && window.fetchPositions) {
    loadCustomAssets();  // 內部會呼叫 calculateAssets
    loadNotifications();
    loadRealized();
  } else {
    setTimeout(waitInit, 100);
  }
})();
</script>
